<style>
/* Layout: a console home. The game you point at fills the screen; rows of covers sit on top of it.
   Dark by default; a light theme is one click away (top bar). */
:root {
  color-scheme: dark;
  --ground: #0a0d12;
  --panel: #12161d;
  --raised: #1a2029;
  --raised-2: #242c37;
  --rule: #262e39;
  --ink: #f3f5f8;
  --ink-dim: #a4adba;
  --ink-faint: #6e7886;
  --signal: #ffb21d;
  --go: #ffffff;
  --go-deep: #e8ecf1;
  --on-go: #0a0d12;
  --install: #cfe0f5;
  --install-deep: #b7cde8;
  --on-install: #0a0d12;
  --good: #3ddc84;
  --danger: #ff5d55;
  --cut-bg: #1f4a2e;
  --cut-ink: #7cf0a8;

  --line-steam: #4ea3e8;
  --line-epic: #cfd5dd;
  --line-gog: #a874f5;
  --line-ubisoft: #1fc1c4;
  --line-ea: #ff5d55;
  --line-battlenet: #6f7dff;
  --line-rockstar: #ff8a3d;
  --line-xbox: #9bd14a;
  --line-manual: #e38fd9;

  --font-display: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "Cascadia Mono", Consolas, monospace;

  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --sidebar: 0px;
  --radius: 10px;
  /* Corners: fixed sizes are multiplied by --round, and pill shapes use --pill, so a style can make them all
     sharper or rounder at once (Junction: 1 and fully round). */
  --round: 1;
  --pill: 999px;
  /* Text that sits on top of game art stays light in both themes. */
  --on-image: #f3f6f9;
  --on-image-dim: #c5cdd7;
  --title-shadow: 0 2px 18px rgb(0 0 0 / .5);
  /* How much the ground colour covers the game art behind Home and the Store (lighter in the light theme). */
  --wash-mid: 45%; --wash-mid-at: 46%; --wash-end: 80%; --wash-bottom: 55%; --wash-bottom-at: 32%; --wash-bottom-end: 62%; --shade: 58%;
}
/* Light theme: chosen in the top bar, or "Match Windows" when Windows is set to light. */
:root[data-theme="light"] {
  color-scheme: light;
  --ground: #eef1f5; --panel: #ffffff; --raised: #f4f6f9; --raised-2: #e4e8ee; --rule: #d5dbe3;
  --ink: #12161d; --ink-dim: #4b5563; --ink-faint: #7b8593;
  --signal: #b06f00; --go: #12161d; --go-deep: #2a313c; --on-go: #ffffff;
  --install: #1d4f8f; --install-deep: #173f73; --on-install: #ffffff; --good: #138a4a; --danger: #d0342c;
  --cut-bg: #d6f0dd; --cut-ink: #165c33;
  --line-steam: #2a78bd; --line-epic: #59626e; --line-gog: #8547dc; --line-ubisoft: #0d8c8f;
  --line-ea: #e0453d; --line-battlenet: #4f5ee8; --line-rockstar: #c45a10; --line-xbox: #4a8a10; --line-manual: #c25bb5;
  --title-shadow: none;
  --wash-mid: 42%; --wash-mid-at: 36%; --wash-end: 74%; --wash-bottom: 52%; --wash-bottom-at: 22%; --wash-bottom-end: 58%; --shade: 44%;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    color-scheme: light;
    --ground: #eef1f5; --panel: #ffffff; --raised: #f4f6f9; --raised-2: #e4e8ee; --rule: #d5dbe3;
    --ink: #12161d; --ink-dim: #4b5563; --ink-faint: #7b8593;
    --signal: #b06f00; --go: #12161d; --go-deep: #2a313c; --on-go: #ffffff;
    --install: #1d4f8f; --install-deep: #173f73; --on-install: #ffffff; --good: #138a4a; --danger: #d0342c;
    --cut-bg: #d6f0dd; --cut-ink: #165c33;
    --line-steam: #2a78bd; --line-epic: #59626e; --line-gog: #8547dc; --line-ubisoft: #0d8c8f;
    --line-ea: #e0453d; --line-battlenet: #4f5ee8; --line-rockstar: #c45a10; --line-xbox: #4a8a10; --line-manual: #c25bb5;
    --title-shadow: none;
    --wash-mid: 28%; --wash-mid-at: 36%; --wash-end: 60%; --wash-bottom: 40%; --wash-bottom-at: 22%; --wash-bottom-end: 46%; --shade: 30%;
  }
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--ground);
  color: var(--ink);
  font: 15px/1.5 var(--font-body);
  overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
img { display: block; }

/* ---------- shell ---------- */
.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr;
  grid-template-columns: var(--sidebar) minmax(0, 1fr);
  grid-template-areas: "top top" "side main";
}
.topbar {
  grid-area: top;
  display: flex; align-items: center; gap: 28px;
  padding-block: 10px;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  background: var(--panel);
  border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 20px; height: 31px; flex: none; display: block; }
.nav { display: flex; gap: 4px; }
.nav button {
  background: none; border: 0; padding: 8px 12px; border-radius: var(--radius);
  font: 600 14px/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-dim); display: flex; align-items: center; gap: 8px;
}
.nav button:hover { color: var(--ink); background: var(--raised); }
.nav button[aria-current="page"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--signal); border-radius: 0; }
.soon {
  font: 600 10px/1 var(--font-display); letter-spacing: .1em;
  padding: 3px 5px; border-radius: calc(3px * var(--round)); background: var(--raised-2); color: var(--ink-dim);
}
.top-right { margin-left: auto; display: flex; align-items: center; gap: 14px; color: var(--ink-dim); font-size: 13px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--raised); border: 1px solid var(--rule); border-radius: var(--radius);
  padding: 7px 12px; font-size: 14px;
}
.btn:hover { background: var(--raised-2); }
.btn svg { width: 16px; height: 16px; }
.icon-btn {
  width: 40px; height: 40px; display: grid; place-items: center;
  background: var(--raised); border: 1px solid var(--rule); border-radius: var(--radius);
}
.icon-btn:hover { background: var(--raised-2); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn[aria-pressed="true"] { color: var(--signal); border-color: color-mix(in srgb, var(--signal) 45%, var(--rule)); }
.menu-btn { display: none; }

/* ---------- sidebar ---------- */
.sidebar {
  grid-area: side;
  display: flex; flex-direction: column; min-height: 0;
  background: var(--panel);
  border-right: 1px solid var(--rule);
}
.side-head { padding: 14px 14px 10px var(--gutter-l); display: grid; gap: 12px; }
.search { position: relative; }
.search svg { position: absolute; left: 10px; top: 50%; translate: 0 -50%; width: 16px; height: 16px; color: var(--ink-faint); }
.search input {
  width: 100%; box-sizing: border-box;
  background: var(--raised); border: 1px solid var(--rule); border-radius: var(--radius);
  padding: 8px 10px 8px 34px;
}
.search input::placeholder { color: var(--ink-faint); }
.lines { display: flex; flex-wrap: wrap; gap: 6px; }
.line-chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: transparent; border: 1px solid var(--rule); border-radius: var(--pill);
  padding: 3px 9px 3px 7px; font-size: 12.5px; color: var(--ink-dim);
}
.line-chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.line-chip b { font-weight: 600; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.line-chip[aria-pressed="true"] { color: var(--ink); border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
.line-chip[aria-pressed="true"] b { color: var(--ink-dim); }
.accounts { display: grid; gap: 6px; }
.accounts .chip-label { font: 600 11px/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); }
.accounts .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.line-chip .now { font-size: 11px; color: var(--line-steam); }
.signed-in { display: flex; align-items: center; gap: 7px; }
.signed-in i { width: 8px; height: 8px; border-radius: 50%; background: var(--line-steam); box-shadow: 0 0 0 3px color-mix(in srgb, var(--line-steam) 25%, transparent); }
.signed-in b { color: var(--ink); font-weight: 500; }
.play-wrap { display: grid; gap: 7px; justify-items: start; }
.switch-note { font-size: 12.5px; color: var(--ink-dim); display: flex; align-items: center; gap: 6px; }
.switch-note svg { width: 14px; height: 14px; color: var(--line-steam); }

.game-list { flex: 1; overflow-y: auto; padding: 4px 8px 12px calc(var(--gutter-l) - 8px); }
.list-label {
  font: 600 12px/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-faint); padding: 14px 8px 8px; display: flex; justify-content: space-between;
}
.row {
  width: 100%; display: grid; grid-template-columns: 3px minmax(0, 1fr); align-items: center; gap: 10px;
  background: none; border: 0; border-radius: calc(4px * var(--round)); padding: 5px 8px 5px 0; text-align: left;
  color: var(--ink-dim);
}
.row:hover { background: var(--raised); color: var(--ink); }
.row[aria-current="true"] { background: var(--raised-2); color: var(--ink); }
.row .stripe { height: 18px; border-radius: calc(2px * var(--round)); background: var(--c); }
.row.off { color: var(--ink-faint); }
.row.off .stripe { opacity: .35; }
.row.off:hover { color: var(--ink-dim); }
.scope { display: grid; grid-template-columns: 1fr 1fr; background: var(--raised); border: 1px solid var(--rule); border-radius: var(--radius); padding: 2px; }
.scope button { background: none; border: 0; border-radius: calc(4px * var(--round)); padding: 5px 8px; font-size: 13px; color: var(--ink-dim); }
.scope button[aria-pressed="true"] { background: var(--raised-2); color: var(--ink); }
.scope b { font-weight: 600; color: var(--ink-faint); font-variant-numeric: tabular-nums; margin-left: 4px; }
.row span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.side-foot {
  border-top: 1px solid var(--rule);
  padding: 10px 14px 12px var(--gutter-l);
  display: flex; gap: 8px; justify-content: space-between; align-items: center;
}
.toggle-hidden { background: none; border: 0; color: var(--ink-faint); font-size: 13px; padding: 4px 0; }
.toggle-hidden:hover { color: var(--ink); }

/* ---------- main canvas ---------- */
.main { grid-area: main; overflow-y: auto; min-width: 0; }
.page { padding: 28px var(--gutter-r) 48px 32px; display: grid; gap: 36px; max-width: 1500px; }
.page-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
h1, h2 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: 34px; font-weight: 700; letter-spacing: .02em; line-height: 1.1; }
h2 { font-size: 15px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
.summary { color: var(--ink-dim); margin-top: 6px; font-variant-numeric: tabular-nums; }
.section { display: grid; gap: 14px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sort { display: flex; align-items: center; gap: 8px; color: var(--ink-dim); font-size: 13px; }
.sort select { background: var(--raised); border: 1px solid var(--rule); border-radius: var(--radius); padding: 5px 8px; }

/* jump back in */
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px; }
.wide {
  position: relative; border: 0; padding: 0; border-radius: var(--radius); overflow: hidden;
  aspect-ratio: 1280 / 500; max-width: 100%; max-height: 240px; width: 100%; background: var(--raised); text-align: left;
  box-shadow: 0 0 0 1px var(--rule);
  transition: box-shadow .18s, translate .18s;
}
.wide img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.wide::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 30%, rgb(8 11 15 / .92)); }
.wide .over { position: absolute; inset: auto 16px 14px 16px; z-index: 1; display: grid; gap: 6px; }
.wide .logo { max-height: 56px; max-width: 60%; object-fit: contain; object-position: left bottom; }
.wide .title { font: 700 22px/1.1 var(--font-display); color: var(--on-image); }
.wide .meta { font-size: 13px; color: var(--on-image-dim); display: flex; gap: 10px; align-items: center; }
.wide:hover { translate: 0 -3px; box-shadow: 0 0 0 1px var(--c), 0 10px 30px -12px var(--c); }

/* grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 16px; }
.card { background: none; border: 0; padding: 0; text-align: left; display: grid; gap: 8px; color: var(--ink-dim); }
.cover {
  position: relative; aspect-ratio: 2 / 3; max-width: 100%; border-radius: var(--radius); overflow: hidden;
  background: var(--raised); box-shadow: 0 0 0 1px var(--rule);
  transition: box-shadow .18s, translate .18s;
}
.cover img { width: 100%; height: 100%; object-fit: cover; }
.cover .line { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--c); }
.cover .play-hint {
  position: absolute; right: 10px; bottom: 14px; width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center; background: var(--go); color: var(--on-go);
  opacity: 0; translate: 0 6px; transition: opacity .15s, translate .15s;
}
.cover .play-hint svg { width: 16px; height: 16px; margin-left: 2px; }
.card:hover .cover, .card:focus-visible .cover { translate: 0 -4px; box-shadow: 0 0 0 1px var(--c), 0 14px 28px -14px var(--c); }
.card:hover .play-hint, .card:focus-visible .play-hint { opacity: 1; translate: 0 0; }
.card.off .cover img { filter: grayscale(.85) brightness(.7); transition: filter .18s; }
.card.off:hover .cover img, .card.off:focus-visible .cover img { filter: none; }
.card.off .play-hint { background: var(--install); color: var(--on-install); }
.card.off .play-hint svg { margin-left: 0; }
.card:focus-visible { outline: none; }
.card .name { font-size: 14px; line-height: 1.3; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .sub { font-size: 12.5px; color: var(--ink-faint); margin-top: -4px; }
.fav-dot { position: absolute; top: 8px; right: 8px; color: var(--signal); filter: drop-shadow(0 1px 2px rgb(0 0 0 / .8)); }
.fav-dot svg { width: 16px; height: 16px; }

/* placeholder art for games without any */
.fallback-art {
  position: absolute; inset: 0; display: grid; align-content: space-between; padding: 14px;
  background:
    repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 10%, transparent) 0 2px, transparent 2px 14px),
    linear-gradient(160deg, color-mix(in srgb, var(--c) 34%, var(--raised)), var(--panel));
}
.fallback-art .initials { font: 700 44px/1 var(--font-display); color: color-mix(in srgb, var(--c) 60%, var(--ink)); }
.fallback-art .t { font: 600 17px/1.15 var(--font-display); color: var(--ink); text-wrap: balance; }
.fallback-art img.icon { width: 56%; height: auto; margin: auto; align-self: center; filter: drop-shadow(0 6px 14px rgb(0 0 0 / .5)); }

/* ---------- game page ---------- */
.hero {
  position: relative; min-height: 260px; aspect-ratio: 1280 / 414; max-height: 46vh; width: 100%;
  background: var(--panel); overflow: hidden;
}
.hero > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgb(14 18 24 / .15) 40%, var(--ground)); }
.hero .fallback-art { padding: 0; }
.hero .fallback-art img.icon { width: auto; height: 60%; }
.hero-inner { position: absolute; inset: 0; z-index: 1; padding: 18px var(--gutter-r) 22px 32px; display: flex; flex-direction: column; justify-content: space-between; }
.back { align-self: flex-start; background: color-mix(in srgb, var(--ground) 72%, transparent); backdrop-filter: blur(6px); }
.hero .logo { max-width: min(460px, 70%); max-height: 150px; object-fit: contain; object-position: left bottom; filter: drop-shadow(0 4px 16px rgb(0 0 0 / .6)); }
.hero .title { font: 700 clamp(30px, 4.4vw, 52px)/1.05 var(--font-display); text-shadow: var(--title-shadow); max-width: 22ch; }

.actionbar {
  display: flex; align-items: center; gap: 28px; flex-wrap: wrap;
  padding: 16px var(--gutter-r) 16px 32px;
  background: var(--panel); border-block: 1px solid var(--rule);
}
.play {
  display: inline-flex; align-items: center; gap: 12px;
  background: linear-gradient(180deg, var(--go), var(--go-deep));
  color: var(--on-go); border: 0; border-radius: var(--radius);
  padding: 13px 34px 13px 26px;
  font: 700 22px/1 var(--font-display); letter-spacing: .08em;
  box-shadow: 0 8px 22px -10px var(--go);
  transition: filter .15s, translate .15s;
}
.play svg { width: 20px; height: 20px; }
.play:hover { filter: brightness(1.1); translate: 0 -1px; }
.play[data-state="starting"] { filter: saturate(.6); }
.play.install { background: linear-gradient(180deg, var(--install), var(--install-deep)); color: var(--on-install); box-shadow: 0 8px 22px -10px var(--install); }
.play.install svg { width: 22px; height: 22px; }
.hero > img.bg.blur { filter: blur(26px) saturate(1.2) brightness(.7); scale: 1.2; }
.stats { display: flex; gap: 28px; flex-wrap: wrap; }
.stat { display: grid; gap: 2px; }
.stat dt { font: 600 11.5px/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); }
.stat dd { margin: 0; font-size: 15px; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 7px; }
.badge-line { width: 18px; height: 4px; border-radius: calc(2px * var(--round)); background: var(--c); }
.tools { margin-left: auto; display: flex; gap: 8px; }

.details { padding: 26px var(--gutter-r) 48px 32px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; max-width: 1200px; }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.panel p { margin: 0; color: var(--ink-dim); max-width: 62ch; }
code.cmd {
  display: block; font: 13px/1.5 var(--font-mono); color: var(--ink);
  background: var(--ground); border: 1px solid var(--rule); border-radius: calc(4px * var(--round));
  padding: 10px 12px; overflow-x: auto; white-space: pre;
}

/* ---------- modal + toast ---------- */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgb(4 6 9 / .7); display: grid; place-items: center; padding: 16px; }
.dialog { width: min(440px, calc(100vw - 32px)); box-sizing: border-box; background: var(--panel); border: 1px solid var(--rule); border-radius: calc(10px * var(--round)); padding: 22px; display: grid; gap: 14px; box-shadow: 0 30px 60px -20px #000; }
.dialog h2 { color: var(--ink); font-size: 20px; letter-spacing: .04em; text-transform: none; }
.dialog label { display: grid; gap: 6px; font-size: 13px; color: var(--ink-dim); }
.dialog input { background: var(--raised); border: 1px solid var(--rule); border-radius: var(--radius); padding: 9px 10px; }
.dialog .hint { font-size: 13px; color: var(--ink-faint); margin: 0; }
.dialog .row-btns { display: flex; justify-content: flex-end; gap: 8px; }
.dialog .add-path { display: flex; gap: 8px; }
.dialog .add-path input { flex: 1; min-width: 0; }
.btn.primary { background: var(--signal); color: #1a1205; border-color: var(--signal); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); background: var(--signal); }
.toast {
  position: fixed; z-index: 30; left: 50%; translate: -50% 0;
  bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  max-width: calc(100% - 32px); box-sizing: border-box;
  background: var(--raised-2); border: 1px solid var(--rule); border-left: 4px solid var(--c, var(--signal));
  border-radius: var(--radius); padding: 11px 16px; box-shadow: 0 16px 40px -14px #000;
  font-size: 14px;
}
.empty { color: var(--ink-dim); padding: 30px 0; }

/* ---------- store + wishlist ---------- */
.app[data-section="store"], .app[data-section="wishlist"] { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "main"; }
.app[data-section="store"] .sidebar, .app[data-section="wishlist"] .sidebar,
.app[data-section="store"] .menu-btn, .app[data-section="wishlist"] .menu-btn { display: none; }
.app[data-section="store"] .page, .app[data-section="wishlist"] .page { padding-left: var(--gutter-l); margin-inline: auto; width: 100%; box-sizing: border-box; }
.store-search { position: relative; max-width: 680px; }
.store-search svg { position: absolute; left: 14px; top: 50%; translate: 0 -50%; width: 18px; height: 18px; color: var(--ink-faint); }
.store-search input {
  width: 100%; box-sizing: border-box; font-size: 16px;
  background: var(--raised); border: 1px solid var(--rule); border-radius: var(--radius);
  padding: 12px 14px 12px 42px;
}
.store-search input::placeholder { color: var(--ink-faint); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.filters .spacer { flex: 1; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-dim); cursor: pointer; }
.check input { accent-color: var(--signal); width: 16px; height: 16px; margin: 0; }
.note { font-size: 13px; color: var(--ink-faint); margin: 0; }

.deal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 236px), 1fr)); gap: 16px; }
.deal {
  display: grid; grid-template-rows: auto 1fr; padding: 0; text-align: left; overflow: hidden;
  background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius);
  transition: border-color .15s, translate .15s, box-shadow .15s;
}
.deal:hover, .deal:focus-visible { border-color: var(--c); translate: 0 -3px; box-shadow: 0 12px 26px -16px var(--c); outline: none; }
.deal:focus-visible { box-shadow: 0 0 0 3px var(--ink), 0 12px 26px -16px var(--c); }
.deal .img { aspect-ratio: 460 / 215; max-width: 100%; background: var(--raised); overflow: hidden; position: relative; }
.deal .img img { width: 100%; height: 100%; object-fit: cover; }
.deal .img .ph { position: absolute; inset: 0; display: grid; place-items: center; font: 700 30px var(--font-display); color: var(--ink-faint); }
.deal .body { padding: 10px 12px 12px; display: grid; gap: 8px; align-content: space-between; min-width: 0; }
.deal .t { font-size: 14.5px; line-height: 1.3; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.flags { display: flex; gap: 6px; flex-wrap: wrap; min-height: 0; }
.flag { font: 600 10.5px/1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; padding: 4px 6px; border-radius: calc(3px * var(--round)); }
.flag.low { background: color-mix(in srgb, var(--signal) 18%, transparent); color: var(--signal); }
.flag.owned { background: var(--raised-2); color: var(--ink-dim); }
.flag.wish { background: color-mix(in srgb, var(--line-steam) 18%, transparent); color: var(--line-steam); }
.price-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.shop { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-dim); min-width: 0; }
.shop i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.pr { display: inline-flex; align-items: center; gap: 7px; font-variant-numeric: tabular-nums; }
.cut { font: 700 14px/1 var(--font-display); background: var(--cut-bg); color: var(--cut-ink); padding: 4px 6px; border-radius: calc(3px * var(--round)); }
.was { color: var(--ink-faint); text-decoration: line-through; font-size: 12.5px; }
.now-price { font: 600 17px/1 var(--font-display); color: var(--ink); }
.more { justify-self: center; }
.tabs { display: inline-grid; grid-auto-flow: column; background: var(--raised); border: 1px solid var(--rule); border-radius: var(--radius); padding: 2px; }
.tabs button { background: none; border: 0; border-radius: calc(4px * var(--round)); padding: 6px 14px; font: 600 13px/1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); }
.tabs button[aria-pressed="true"] { background: var(--raised-2); color: var(--ink); }
.link-btn { background: none; border: 0; padding: 4px 0; color: var(--ink-dim); font-size: 13.5px; }
.link-btn:hover { color: var(--signal); }
.line-chip.genre { --c: var(--signal); }
.line-chip.genre:hover { color: var(--ink); border-color: var(--signal); }
.browse { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 28px; align-items: start; }
.filters-toggle { display: none; justify-self: start; }
.filter-panel { position: sticky; top: 12px; max-height: calc(100dvh - 96px); overflow-y: auto; display: grid; gap: 18px; padding: 16px; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); min-width: 0; }
.filter-group { display: grid; gap: 8px; }
.filter-group .chip-label { font: 600 11px/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); }
.filter-group select { background: var(--raised); border: 1px solid var(--rule); border-radius: var(--radius); padding: 7px 8px; }
.genre-list { display: grid; gap: 6px; max-height: 320px; overflow-y: auto; }
.genre-list b { font-weight: 500; color: var(--ink-faint); font-variant-numeric: tabular-nums; margin-left: auto; }
.genre-list .check { width: 100%; }
.store-search.small input { font-size: 14px; padding: 8px 10px 8px 34px; }
.store-search.small svg { left: 10px; width: 16px; height: 16px; }
.facts { margin: -6px 0 0; color: var(--ink-dim); }

.free-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.free {
  position: relative; display: block; border-radius: var(--radius); overflow: hidden; aspect-ratio: 16 / 7; max-width: 100%;
  background: var(--raised); box-shadow: 0 0 0 1px var(--rule); color: var(--ink); text-decoration: none;
}
.free img { width: 100%; height: 100%; object-fit: cover; }
.free::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgb(8 11 15 / .92)); }
.free .over { position: absolute; z-index: 1; inset: auto 14px 12px 14px; display: grid; gap: 4px; }
.free .t { font: 700 19px/1.15 var(--font-display); color: var(--on-image); }
.free .meta { font-size: 13px; color: var(--on-image-dim); }
.free .meta b { color: var(--cut-ink); font-weight: 600; }
.free:hover { box-shadow: 0 0 0 1px var(--line-epic); }

.price-head { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 24px; align-items: start; }
.price-head .img { aspect-ratio: 460 / 215; max-width: 100%; border-radius: var(--radius); overflow: hidden; background: var(--raised); }
.price-head .img img { width: 100%; height: 100%; object-fit: cover; }
.price-head .info { display: grid; gap: 14px; min-width: 0; }
.owned-warn {
  display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px;
  background: color-mix(in srgb, var(--signal) 10%, var(--panel)); border: 1px solid color-mix(in srgb, var(--signal) 40%, var(--rule));
  border-radius: var(--radius); color: var(--ink);
}
.owned-warn svg { width: 18px; height: 18px; color: var(--signal); flex: none; margin-top: 2px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--radius); }
.prices { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 560px; }
.prices th { font: 600 11.5px/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); text-align: left; padding: 12px 14px; background: var(--panel); }
.prices td { padding: 11px 14px; border-top: 1px solid var(--rule); }
.prices td.num, .prices th.num { text-align: right; }
.prices tr.best td { background: color-mix(in srgb, var(--good) 9%, transparent); }
.prices tr.best .now-price { color: var(--good); }
.prices a { color: var(--ink); }
.prices a:hover { color: var(--signal); }
.low-mark { color: var(--signal); font-size: 12px; margin-left: 6px; }

.wish-list { display: grid; gap: 10px; }
.wish {
  display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 16px; align-items: center;
  padding: 10px; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); text-align: left;
}
.wish:hover { border-color: var(--c); }
.wish .img { aspect-ratio: 460 / 215; border-radius: calc(4px * var(--round)); overflow: hidden; background: var(--raised); }
.wish .img img { width: 100%; height: 100%; object-fit: cover; }
.wish .mid { display: grid; gap: 6px; min-width: 0; }
.wish .t { font: 600 17px/1.2 var(--font-display); color: var(--ink); }
.wish .src { font-size: 12.5px; color: var(--ink-faint); }
.wish .right { display: grid; gap: 6px; justify-items: end; }

/* ---------- library: sections, A-Z, filters, layouts ---------- */
.side-more summary {
  list-style: none; cursor: pointer; display: flex; align-items: center; gap: 4px;
  font: 600 12px/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint);
}
.side-more summary::-webkit-details-marker { display: none; }
.side-more summary svg { width: 13px; height: 13px; transition: rotate .15s; }
.side-more[open] summary svg { rotate: 90deg; }
.side-more summary:hover { color: var(--ink-dim); }
.side-more summary b { margin-left: auto; font-weight: 600; color: var(--signal); letter-spacing: .06em; }
.side-more-body { display: grid; gap: 12px; padding-top: 10px; }
.acc-more summary {
  list-style: none; cursor: pointer; display: flex; align-items: center; gap: 4px;
  font: 600 11px/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint);
}
.acc-more summary::-webkit-details-marker { display: none; }
.acc-more summary svg { width: 12px; height: 12px; transition: rotate .15s; }
.acc-more[open] summary svg { rotate: 90deg; }
.acc-more summary:hover { color: var(--ink-dim); }
.acc-more summary b { margin-left: auto; font-weight: 600; letter-spacing: .06em; }
.acc-more .chips { padding-top: 8px; }
.btn.icon-only { padding: 7px; }
.list-label.toggle { width: 100%; background: none; border: 0; cursor: pointer; align-items: center; }
.list-label.toggle span:first-child { display: inline-flex; align-items: center; gap: 4px; }
.list-label.toggle svg { width: 13px; height: 13px; transition: rotate .15s; }
.list-label.toggle[aria-expanded="true"] svg { rotate: 90deg; }
.list-label.toggle:hover { color: var(--ink-dim); }
.az { display: flex; flex-wrap: wrap; gap: 1px; padding: 0 14px 6px var(--gutter-l); }
.az button { background: none; border: 0; border-radius: calc(3px * var(--round)); min-width: 17px; padding: 2px 2px; font: 600 11.5px/1 var(--font-display); color: var(--ink-dim); }
.az button:hover:not(:disabled) { background: var(--raised-2); color: var(--ink); }
.az button:disabled { color: var(--ink-faint); opacity: .45; cursor: default; }
.side-filters { display: grid; gap: 10px; }
.side-filters select { width: 100%; background: var(--raised); border: 1px solid var(--rule); border-radius: var(--radius); padding: 6px 8px; font-size: 13.5px; color: var(--ink-dim); }
.line-chip.coll { --c: var(--signal); }
.line-chip.coll.add { border-style: dashed; color: var(--ink-faint); }
.line-chip.coll.add:hover { color: var(--ink); border-color: var(--signal); }
.link-btn.danger:hover { color: var(--line-ea); }
.link-btn.inline { padding: 0 0 0 6px; color: var(--signal); font-size: inherit; }
.link-btn.inline:hover { text-decoration: underline; }

.view-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.tabs.icons button { padding: 5px 7px; display: grid; place-items: center; }
.tabs.icons svg { width: 16px; height: 16px; }
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: 150px; gap: 16px; overflow-x: auto; padding: 6px 2px 12px; margin: -6px -2px 0; scroll-snap-type: x proximity; scrollbar-width: thin; }
.rail > * { scroll-snap-align: start; }
.app[data-density="compact"] .rail, .app[data-density="list"] .rail { grid-auto-columns: 112px; gap: 12px; }
.grid.compact { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 16px 12px; }
.grid.compact .name { font-size: 13px; }
.grid.compact .sub { display: none; }
.grid.compact .play-hint { width: 32px; height: 32px; right: 8px; bottom: 12px; }

.list-view { display: grid; border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; background: var(--panel); }
.lrow {
  display: grid; grid-template-columns: 4px 34px minmax(0, 1fr) minmax(0, 190px) 80px 110px; gap: 14px; align-items: center;
  padding: 6px 14px 6px 0; background: none; border: 0; border-top: 1px solid var(--rule); text-align: left; color: var(--ink-dim); font-size: 13.5px;
}
.lrow:first-child { border-top: 0; }
.lrow:hover, .lrow:focus-visible { background: var(--raised); outline: none; }
.lrow .stripe { align-self: stretch; background: var(--c); }
.lrow .thumb { position: relative; width: 34px; aspect-ratio: 2 / 3; border-radius: calc(3px * var(--round)); overflow: hidden; background: var(--raised); }
.lrow .thumb img { width: 100%; height: 100%; object-fit: cover; }
.lrow .thumb .fallback-art { padding: 2px; place-content: center; }
.lrow .thumb .fallback-art .initials { font-size: 12px; }
.lrow .thumb .fallback-art .t { display: none; }
.lrow .n { color: var(--ink); font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.lrow .l { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lrow.off .thumb img { filter: grayscale(.85) brightness(.75); }
.lrow.off .n { color: var(--ink-dim); }
.fav-inline { color: var(--signal); display: inline-grid; }
.fav-inline svg { width: 13px; height: 13px; }

.all-games {
  display: flex; align-items: center; gap: 18px; padding: 14px 18px; text-align: left;
  background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); color: var(--ink-dim);
  transition: border-color .15s;
}
.all-games:hover { border-color: var(--signal); }
.all-games .covers { display: flex; flex: none; }
.all-games .covers img { width: 46px; aspect-ratio: 2 / 3; object-fit: cover; border-radius: calc(4px * var(--round)); box-shadow: 0 0 0 2px var(--panel); }
.all-games .covers img + img { margin-left: -16px; }
.all-games .txt { display: grid; gap: 2px; min-width: 0; flex: 1; }
.all-games b { font: 600 18px/1.2 var(--font-display); color: var(--ink); }
.all-games > svg { width: 20px; height: 20px; flex: none; }

/* game page without a hero image: the banner sits sharp on its own blurred copy */
.hero-bottom { display: grid; gap: 14px; justify-items: start; }
.hero:has(.capsule) { aspect-ratio: auto; min-height: 380px; max-height: none; }
.hero:has(.capsule.tall) { min-height: 360px; }
.hero .capsule { width: min(340px, 52%); aspect-ratio: 460 / 215; border-radius: var(--radius); overflow: hidden; box-shadow: 0 16px 40px -14px rgb(0 0 0 / .75), 0 0 0 1px rgb(255 255 255 / .08); }
.hero .capsule.tall { width: 110px; aspect-ratio: 2 / 3; }
.hero .capsule img { width: 100%; height: 100%; object-fit: cover; }
.copies { display: flex; flex-wrap: wrap; gap: 6px; }
.copies .line-chip { font-size: 13px; padding: 4px 10px 4px 8px; }
.details .wide-panel { grid-column: 1 / -1; }

/* price history */
.history { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: 150px auto; gap: 6px 10px; max-width: 900px; }
.history .y { display: flex; flex-direction: column; justify-content: space-between; font-size: 12px; color: var(--ink-faint); text-align: right; font-variant-numeric: tabular-nums; padding-block: 2px; }
.history svg { width: 100%; height: 150px; display: block; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); }
.history .area { fill: color-mix(in srgb, var(--good) 14%, transparent); }
.history .ln { fill: none; stroke: var(--good); stroke-width: 2; vector-effect: non-scaling-stroke; }
.history .plot { position: relative; cursor: crosshair; border-radius: var(--radius); }
.history .plot:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.history .now { fill: none; stroke: var(--ink-faint); stroke-width: 1; stroke-dasharray: 4 4; vector-effect: non-scaling-stroke; }
.hist-guide, .hist-dot, .hist-tip { position: absolute; pointer-events: none; opacity: 0; transition: opacity .12s; }
.history .plot.hover :is(.hist-guide, .hist-dot, .hist-tip) { opacity: 1; }
.hist-guide { top: 1px; bottom: 1px; width: 1px; background: color-mix(in srgb, var(--ink) 35%, transparent); }
.hist-dot { width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px var(--panel); }
.hist-tip { top: 8px; translate: -50% 0; display: grid; gap: 2px; padding: 7px 10px; white-space: nowrap; font-size: 12px; color: var(--ink-dim);
  background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); box-shadow: 0 8px 20px -10px #000; }
.hist-tip.below { top: auto; bottom: 8px; }
.hist-tip b { font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }
.hist-tip .less { color: var(--good); }
.history .x { grid-column: 2; display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-faint); }

/* browse: results header stays put while you scroll */
.results-bar {
  position: sticky; top: 0; z-index: 3; display: grid; gap: 10px;
  margin-top: -28px; padding: 28px 0 12px; background: var(--ground); border-bottom: 1px solid var(--rule);
}
.active-chip { --c: var(--signal); color: var(--ink); border-color: color-mix(in srgb, var(--signal) 50%, var(--rule)); }
.active-chip span { color: var(--ink-faint); font-size: 14px; line-height: 1; }
.active-chip:hover span { color: var(--ink); }
.free.claimed img { filter: grayscale(.7) brightness(.7); }

/* ---------- decluttered game page + play chooser ---------- */
.actionbar { gap: 22px; }
.play-note { font-size: 12.5px; color: var(--ink-faint); display: flex; align-items: center; gap: 4px; }
.play-note .link-btn { font-size: 12.5px; padding: 0; color: var(--ink-dim); text-decoration: underline; text-underline-offset: 2px; }
.owned-on { display: flex; align-items: center; gap: 8px; color: var(--ink-dim); font-size: 14px; }
.game-body { padding: 24px var(--gutter-r) 48px 32px; display: grid; gap: 16px; max-width: 1000px; align-content: start; }
.game-body .facts { margin: 0; color: var(--ink-dim); }
.tech { border-top: 1px solid var(--rule); padding-top: 12px; margin-top: 8px; }
.tech summary { cursor: pointer; color: var(--ink-faint); font-size: 13px; width: max-content; }
.tech summary:hover { color: var(--ink-dim); }
.tech-row { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 4px 14px; align-items: center; margin-top: 12px; }
.tech-row .note { grid-column: 2; }
.chooser { width: min(420px, calc(100vw - 32px)); }
.dialog label.check { display: inline-flex; font-size: 13px; }
.chooser .options { display: grid; gap: 8px; }
.option {
  display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left;
  padding: 10px 12px 10px 0; background: var(--raised); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden;
}
.option > i { align-self: stretch; background: var(--c); margin: -10px 0; }
.option:hover, .option:focus-visible { border-color: var(--c); background: var(--raised-2); outline: none; }
.o-main { display: grid; gap: 2px; min-width: 0; }
.o-main b { font-weight: 600; color: var(--ink); }
.o-main span { font-size: 12.5px; color: var(--ink-faint); }
.o-act { font: 700 13px/1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; padding: 7px 12px; border-radius: calc(4px * var(--round)); background: var(--go); color: var(--on-go); }
.o-act.install { background: var(--install); color: var(--on-install); }
.dialog.uninstall { width: min(440px, calc(100vw - 32px)); }
.dialog.uninstall .options { display: grid; gap: 8px; margin-bottom: 12px; }
.dialog.uninstall .o-act { background: transparent; color: var(--ink-dim); border: 1px solid var(--rule); }
/* quieter chrome */
.side-head { gap: 10px; }
.sidebar, .topbar { border-color: color-mix(in srgb, var(--rule) 70%, transparent); }
.side-foot { justify-content: space-between; padding-block: 8px; }
.card .name { color: var(--ink-dim); }
.card:hover .name { color: var(--ink); }

/* ---------- quick play, menu, search, media, stats ---------- */
.search-btn { color: var(--ink-faint); gap: 8px; padding-inline: 10px; min-width: 180px; }
.search-btn span { margin-right: auto; }
.search-btn:hover { color: var(--ink-dim); }
kbd { font: 600 11px/1 var(--font-body); padding: 3px 5px; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: calc(4px * var(--round)); color: var(--ink-faint); background: var(--panel); }
.cover .play-hint { cursor: pointer; }
.cover .play-hint:hover { filter: brightness(1.12); scale: 1.06; }
.wide-play {
  position: absolute; z-index: 2; right: 16px; bottom: 14px; width: 46px; height: 46px; border-radius: 50%;
  display: grid; place-items: center; background: var(--go); color: var(--on-go); cursor: pointer;
  opacity: 0; translate: 0 6px; transition: opacity .15s, translate .15s;
}
.wide-play svg { width: 18px; height: 18px; margin-left: 2px; }
.wide:hover .wide-play, .wide:focus-visible .wide-play { opacity: 1; translate: 0 0; }
.lrow { grid-template-columns: 4px 34px minmax(0, 1fr) minmax(0, 190px) 80px 110px 30px; }
.lplay { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--go); color: var(--on-go); opacity: 0; cursor: pointer; }
.lplay.install { background: var(--install); color: var(--on-install); }
.lplay svg { width: 12px; height: 12px; }
.lrow:hover .lplay, .lrow:focus-visible .lplay { opacity: 1; }

.ctx {
  position: fixed; z-index: 40; min-width: 210px; max-width: 280px; max-height: calc(100vh - 32px); overflow-y: auto; padding: 6px; display: grid;
  background: var(--raised); border: 1px solid var(--rule); border-radius: calc(8px * var(--round)); box-shadow: 0 18px 40px -16px #000;
}
.ctx-title { padding: 6px 10px 8px; font-size: 12.5px; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px solid var(--rule); margin-bottom: 4px; }
.ctx-label { padding: 8px 10px 2px; font: 600 11px/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); }
.ctx button { background: none; border: 0; border-radius: calc(4px * var(--round)); padding: 7px 10px; text-align: left; font-size: 14px; color: var(--ink-dim); }
.ctx button:hover, .ctx button:focus-visible { background: var(--raised-2); color: var(--ink); outline: none; }
.ctx button.strong { color: var(--ink); font-weight: 600; }
.ctx button.indent { padding-left: 22px; }
.ctx .ctx-group { display: flex; align-items: center; gap: 8px; }
.ctx .ctx-group b { min-width: 18px; padding: 1px 6px; border-radius: var(--pill); background: var(--raised-2); color: var(--ink-dim); font-size: 11px; font-weight: 600; text-align: center; }
.ctx .ctx-group svg { width: 14px; height: 14px; margin-left: auto; color: var(--ink-faint); transition: rotate .15s; }
.ctx .ctx-group[aria-expanded="true"] svg { rotate: 90deg; }
.ctx .ctx-group:hover b, .ctx .ctx-group:focus-visible b { background: var(--rule); }

.scrim.top { place-items: start center; padding-top: 12vh; }
.palette { width: min(640px, 100%); background: var(--panel); border: 1px solid var(--rule); border-radius: calc(12px * var(--round)); box-shadow: 0 30px 70px -20px #000; overflow: hidden; display: grid; }
.pal-input { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--rule); }
.pal-input svg { width: 18px; height: 18px; color: var(--ink-faint); flex: none; }
.pal-input input { flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 17px; }
.pal-input input::placeholder { color: var(--ink-faint); }
.pal-results { max-height: min(56vh, 460px); overflow-y: auto; padding: 6px; }
.pal-group { padding: 10px 10px 4px; font: 600 11px/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); }
.pal-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 6px 10px; background: none; border: 0; border-radius: calc(6px * var(--round)); text-align: left; color: var(--ink-dim); }
.pal-item[aria-selected="true"], .pal-item:hover { background: var(--raised-2); color: var(--ink); }
.pal-thumb { position: relative; flex: none; width: 28px; aspect-ratio: 2 / 3; border-radius: calc(3px * var(--round)); overflow: hidden; background: var(--raised); display: grid; place-items: center; }
.pal-thumb.wide { width: 58px; aspect-ratio: 460 / 215; }
.pal-thumb.none { aspect-ratio: auto; height: 28px; background: none; color: var(--ink-faint); }
.pal-thumb.none svg { width: 14px; height: 14px; }
.pal-thumb img { width: 100%; height: 100%; object-fit: cover; }
.pal-thumb .fallback-art { padding: 0; place-content: center; }
.pal-thumb .fallback-art .initials { font-size: 10px; }
.pal-thumb .fallback-art .t, .pal-thumb .ph { display: none; }
.pal-text { display: grid; min-width: 0; flex: 1; }
.pal-text b { font-weight: 500; color: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pal-text span { font-size: 12.5px; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pal-hint { font-size: 12px; color: var(--ink-faint); opacity: 0; }
.pal-item[aria-selected="true"] .pal-hint { opacity: 1; }
/* Choosing the country prices are for: a search box and the list under it */
.country-search { display: flex; margin: 4px 0 8px; }
.country-list { max-height: min(42vh, 360px); overflow-y: auto; display: grid; gap: 2px; padding: 2px; margin-bottom: 12px; }
.country { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 0; border-radius: calc(6px * var(--round)); background: none; color: var(--ink-dim); text-align: left; font: inherit; }
.country:hover, .country:focus-visible { background: var(--raised-2); color: var(--ink); }
.country[aria-selected="true"] { color: var(--ink); font-weight: 600; }
.country span { flex: 1; }
.country i { font-style: normal; font-size: 12px; color: var(--ink-faint); }
.country svg { width: 16px; height: 16px; flex: none; color: var(--good); }
.pal-foot {display: flex; gap: 16px; padding: 10px 16px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--ink-faint); }
.pal-empty { padding: 14px 16px; }

/* game colour: tints the action bar and the PLAY glow */
.actionbar { background: linear-gradient(90deg, color-mix(in srgb, var(--game, var(--panel)) 13%, var(--panel)), var(--panel) 75%); transition: background .4s; }
.play { box-shadow: 0 10px 28px -10px var(--game, var(--go)); }
.game-body .line-chip.genre { --c: var(--game, var(--signal)); }
.bar { display: block; height: 6px; border-radius: calc(3px * var(--round)); background: var(--raised-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: calc(3px * var(--round)); background: var(--game, var(--go)); }
.media { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 10px; }
.media .m { aspect-ratio: 16 / 9; width: 100%; border-radius: var(--radius); overflow: hidden; background: var(--raised); border: 0; padding: 0; object-fit: cover; display: block; }
.media .shot img { width: 100%; height: 100%; object-fit: cover; transition: scale .25s; }
.media .shot:hover img { scale: 1.04; }
.media .clip { grid-column: span 2; grid-row: span 2; }
.lightbox { background: rgb(4 6 9 / .92); }
.lightbox img { max-width: min(1280px, 92vw); max-height: 84vh; border-radius: var(--radius); box-shadow: 0 30px 80px -20px #000; }
.lb-prev, .lb-next { position: fixed; top: 50%; translate: 0 -50%; }
.lb-prev { left: 16px; } .lb-next { right: 16px; }
.lb-count { position: fixed; bottom: 18px; left: 50%; translate: -50% 0; color: var(--on-image-dim); font-size: 13px; }
.cover-dialog .cover-preview { width: 150px; }
.cover-dialog label.btn { display: inline-flex; cursor: pointer; }

.app[data-section="stats"] { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "main"; }
.app[data-section="stats"] .sidebar, .app[data-section="stats"] .menu-btn { display: none; }
.app[data-section="stats"] .page { padding-left: var(--gutter-l); margin-inline: auto; width: 100%; box-sizing: border-box; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.kpi { display: grid; gap: 4px; padding: 14px 16px; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); }
.kpi b { font: 700 28px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 13px; color: var(--ink-dim); }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 36px 40px; }
.stats-grid .section { align-content: start; }
.bars { display: grid; gap: 4px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr) 64px; gap: 12px; align-items: center; padding: 5px 6px; background: none; border: 0; border-radius: calc(4px * var(--round)); text-align: left; color: var(--ink-dim); font-size: 13.5px; }
button.bar-row:hover { background: var(--raised); color: var(--ink); }
.bar-row .bl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-row .bt { height: 8px; border-radius: calc(4px * var(--round)); background: var(--raised); overflow: hidden; }
.bar-row .bt i { display: block; height: 100%; border-radius: calc(4px * var(--round)); background: var(--c); }
.bar-row .bv { text-align: right; font-variant-numeric: tabular-nums; }

.downloads { padding: 0 8px 4px calc(var(--gutter-l) - 8px); }
.dl { width: 100%; display: grid; gap: 4px; padding: 6px 8px; background: none; border: 0; border-radius: calc(4px * var(--round)); text-align: left; }
.dl:hover { background: var(--raised); }
.dl-name { font-size: 14px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dl-meta { font-size: 12px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.dl .bar i { background: var(--c); }
.dl-more { display: inline-flex; align-items: center; gap: 4px; margin: 2px 0 0; padding: 6px 8px; background: none; border: 0; border-radius: calc(4px * var(--round)); font-size: 13px; font-weight: 600; color: var(--ink-dim); }
.dl-more:hover, .dl-more:focus-visible { background: var(--raised); color: var(--ink); outline: none; }
.dl-more svg { width: 13px; height: 13px; rotate: 90deg; transition: rotate .15s; }
.dl-more[aria-expanded="true"] svg { rotate: -90deg; }

/* page changes fade in; the store shows grey cards while it loads */
@keyframes rise { from { opacity: 0; translate: 0 6px; } }
.main.enter > * { animation: rise .22s ease-out backwards; }
@keyframes shimmer { to { background-position: -200% 0; } }
.sk { border-radius: var(--radius); background: linear-gradient(90deg, var(--raised) 30%, var(--raised-2) 50%, var(--raised) 70%) 0 0 / 200% 100%; animation: shimmer 1.3s linear infinite; }
.sk-title { width: 160px; height: 34px; margin-bottom: 10px; }
.sk-line { width: min(420px, 80%); height: 14px; }
.sk-card { aspect-ratio: 236 / 190; }

/* ---------- store game page + wishlist ---------- */
a.play { text-decoration: none; }
.play.buy { background: linear-gradient(180deg, var(--install), var(--install-deep)); color: var(--on-install); box-shadow: 0 10px 28px -10px var(--game, var(--install)); font-size: 18px; padding: 14px 24px; }
.buy-price { display: flex; align-items: center; gap: 10px; }
.big-price { font: 700 30px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.big-price.muted { font-size: 18px; color: var(--ink-dim); }
.buybar .play-wrap { min-width: 180px; }
.buy-acts { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.buy-acts .wish-btn { padding: 14px 24px 14px 20px; font-size: 16px; }
.buy-acts .wish-btn svg { width: 17px; height: 17px; }
.owned-line { display: flex; align-items: center; gap: 8px; margin: 0; color: var(--signal); }
.owned-line svg { width: 16px; height: 16px; flex: none; }
.prices a.shop { text-decoration: none; color: var(--ink); }
.prices a.shop:hover { color: var(--signal); }
.open-store { text-decoration: none; font-size: 16px; padding: 4px 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.game-body .section { gap: 10px; }

.wish { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: stretch; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; padding: 0; transition: border-color .15s; }
.wish:hover { border-color: var(--c); }
.wish-open { display: grid; grid-template-columns: 150px minmax(0, 1fr) 110px auto; gap: 16px; align-items: center; padding: 10px 6px 10px 10px; background: none; border: 0; text-align: left; color: inherit; min-width: 0; }
.wish-open .img { aspect-ratio: 460 / 215; border-radius: calc(4px * var(--round)); overflow: hidden; background: var(--raised); position: relative; }
.wish-open .img img { width: 100%; height: 100%; object-fit: cover; }
.wish-open .mid { display: grid; gap: 6px; min-width: 0; }
.wish-open .t { font: 600 17px/1.2 var(--font-display); color: var(--ink); }
.wish-open .right { display: grid; gap: 6px; justify-items: end; }
.wish-open .flags .note { font-size: 12.5px; }
.spark { width: 100%; height: 26px; display: block; }
.spark path { fill: none; stroke: var(--c); stroke-width: 1.6; vector-effect: non-scaling-stroke; opacity: .85; }
.unwish { width: 44px; background: none; border: 0; border-left: 1px solid var(--rule); color: var(--ink-faint); font-size: 22px; line-height: 1; }
.unwish:hover { color: var(--line-ea); background: var(--raised); }
.empty-state { display: grid; gap: 14px; justify-items: start; padding: 24px 0; color: var(--ink-dim); max-width: 520px; }
.empty-state p { margin: 0; }

/* ---------- console look: shell ---------- */
.app, .app[data-section] { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); grid-template-areas: none; }
.topbar { grid-area: auto; grid-row: 1; grid-column: 1; z-index: 5; gap: 22px; padding-block: 14px; padding-left: calc(var(--gutter-l) + 16px); padding-right: calc(var(--gutter-r) + 8px); background: var(--ground); border-bottom: 0; }
.main { grid-area: auto; grid-row: 2; grid-column: 1; }
.app[data-view="home"] .main, .app[data-view="game"] .main { grid-row: 1 / -1; }
.app[data-view="home"] .topbar, .app[data-view="game"] .topbar { background: linear-gradient(180deg, color-mix(in srgb, var(--ground) 78%, transparent), transparent); }
.nav { gap: 2px; }
.nav button { font: 600 15px/1 var(--font-body); letter-spacing: 0; text-transform: none; padding: 9px 14px; border-radius: var(--pill); color: var(--ink-dim); }
.nav button:hover { background: color-mix(in srgb, var(--ink) 10%, transparent); color: var(--ink); }
.nav button[aria-current="page"] { color: var(--ground); background: var(--ink); box-shadow: none; border-radius: var(--pill); }
.top-right { gap: 4px; }
.top-right .icon-btn { width: 38px; height: 38px; border-radius: 50%; background: transparent; border: 0; color: var(--ink); }
.top-right .icon-btn:hover { background: color-mix(in srgb, var(--ink) 12%, transparent); }
.top-right .icon-btn svg { width: 19px; height: 19px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--signal); color: #1a1205; font: 800 14px/1 var(--font-body); margin-right: 6px; }
.avatar.pic { background: var(--raised); overflow: hidden; box-shadow: 0 0 0 2px color-mix(in srgb, var(--ink) 18%, transparent); }
.avatar.pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
button.avatar { border: 0; padding: 0; cursor: pointer; }
button.avatar:hover { box-shadow: 0 0 0 2px color-mix(in srgb, var(--ink) 45%, transparent); }
button.avatar svg { width: 18px; height: 18px; }
/* The API key dialogs (from the menu under the profile picture) */
.dialog.keys { width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow-y: auto; }
.dialog.keys a { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
.key-row { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid var(--rule); }
.key-who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.key-who .face { width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--raised); font-size: 11px; font-weight: 700; color: var(--ink); object-fit: cover; }
.key-who b { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.key-who i { font-style: normal; font-size: 11.5px; color: var(--ink-faint); white-space: nowrap; }
.key-state { margin-left: auto; font-size: 12.5px; color: var(--ink-faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
.key-state.on { color: var(--good); }
.key-field { display: flex; gap: 8px; }
.dialog .key-field input { flex: 1; min-width: 0; font-family: ui-monospace, Consolas, monospace; }
.key-msg { margin: 0; font-size: 13px; color: var(--ink-dim); }
.key-msg:empty { display: none; }
.key-msg.bad { color: var(--signal); }
.acct-remove { width: 30px; height: 30px; flex: none; border-radius: 50%; background: none; border: 0; color: var(--ink-faint); display: grid; place-items: center; }
.acct-remove svg { width: 16px; height: 16px; }
.acct-remove:hover, .acct-remove:focus-visible { color: var(--ink); background: var(--raised-2); }
.acct-remove.sure { width: auto; padding: 0 12px; border-radius: var(--pill); font: 600 12.5px/1 var(--font-body); color: var(--ground); background: var(--signal); }
.key-removed { display: grid; gap: 6px; padding-top: 12px; border-top: 1px solid var(--rule); }
.key-removed[hidden] { display: none; }
.key-removed .ctx-label { padding: 0 0 2px; }
.key-removed-row { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-dim); }
.key-removed-row b { font-weight: 500; margin-right: auto; }
.key-removed-row .btn { padding: 6px 12px; font-size: 13px; }
/* The menu under your profile picture */
.ctx.profile { width: 300px; max-width: calc(100vw - 16px); padding: 8px; gap: 1px; border-radius: calc(12px * var(--round)); }
.ctx.profile button { display: flex; align-items: center; gap: 12px; padding: 10px 10px; border-radius: calc(8px * var(--round)); color: var(--ink); font-size: 14px; }
.ctx.profile .ctx-label { padding: 10px 10px 4px; }
.pm-head { display: flex; align-items: center; gap: 12px; padding: 6px 8px 12px; margin-bottom: 4px; border-bottom: 1px solid var(--rule); min-width: 0; }
.pm-head .face { width: 40px; height: 40px; border-radius: 50%; flex: none; object-fit: cover; display: grid; place-items: center; background: var(--signal); color: #1a1205; font-weight: 800; }
.pm-head .face svg { width: 20px; height: 20px; }
.pm-head span { display: grid; gap: 2px; min-width: 0; }
.pm-head b { font-size: 15px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pm-head small { font-size: 12px; color: var(--ink-faint); }
.pm-ico { width: 18px; height: 18px; flex: none; color: var(--ink-faint); display: grid; place-items: center; }
.pm-ico svg { width: 18px; height: 18px; }
.ctx.profile button:hover .pm-ico, .ctx.profile button:focus .pm-ico { color: var(--ink); }
.pm-label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pm-val { display: flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--ink-faint); white-space: nowrap; }
.pm-val svg { width: 14px; height: 14px; }
.pm-check { width: 16px; height: 16px; color: var(--signal); visibility: hidden; }
.pm-check svg { width: 16px; height: 16px; }
.ctx.profile [aria-checked="true"] .pm-check { visibility: visible; }
.pm-switch { width: 34px; height: 20px; flex: none; border-radius: var(--pill); background: var(--rule); position: relative; transition: background .15s; }
.pm-switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--ink-dim); transition: translate .15s, background .15s; }
.ctx.profile [aria-checked="true"] .pm-switch { background: var(--signal); }
.ctx.profile [aria-checked="true"] .pm-switch::after { translate: 14px 0; background: #1a1205; }
.ctx.profile .pm-back { font-weight: 600; }
.ctx.profile:has(.pm-fly) { overflow: visible; }
.pm-fly { position: absolute; right: calc(100% + 8px); width: 250px; padding: 8px; display: grid; gap: 1px; box-sizing: border-box;
  background: var(--raised); border: 1px solid var(--rule); border-radius: calc(12px * var(--round)); box-shadow: 0 18px 40px -16px #000; }
.pm-fly.right { right: auto; left: calc(100% + 8px); }
.ctx.profile .pm-fly .ctx-label { padding: 6px 10px 6px; }
.pm-fly .pm-label { display: grid; gap: 2px; white-space: normal; }
.pm-fly .pm-label b { font-weight: 600; }
.pm-fly .pm-label small { font-size: 12px; color: var(--ink-faint); }
.ctx.profile [aria-expanded="true"] { background: var(--raised-2); }
/* A frosted panel can't be frosted again inside it, so while the side menu is open the menu itself goes solid and the side menu is frosted. */
html[data-style="glass"] .ctx.profile:has(.pm-fly) { backdrop-filter: none; background: rgb(20 26 36 / .94); }
html[data-style="glass"] .pm-fly { background: rgb(20 26 36 / .8); border-color: rgb(255 255 255 / .14); backdrop-filter: blur(26px) saturate(1.4); }
.pm-sep { height: 1px; background: var(--rule); margin: 4px 2px 6px; }
#signed-in:is(.has-update, .needs-signin) { position: relative; overflow: visible; }
#signed-in:is(.has-update, .needs-signin) img { border-radius: 50%; }
#signed-in:is(.has-update, .needs-signin)::after { content: ""; position: absolute; top: -2px; right: -2px; width: 11px; height: 11px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 2px var(--ground); }
.ctx.profile .pm-update { color: var(--signal); font-weight: 600; }
.ctx.profile .pm-update .pm-ico { color: var(--signal); }
.ctx.profile .pm-update .pm-val { color: #1a1205; background: var(--signal); padding: 3px 8px; border-radius: var(--pill); font-weight: 700; font-size: 11px; }
.update-notes { max-height: 260px; overflow-y: auto; padding: 2px 16px; border-radius: calc(10px * var(--round)); background: var(--raised); font-size: 13.5px; line-height: 1.5; color: var(--ink-dim); }
.update-notes h3 { margin: 12px 0 4px; font-size: 14px; color: var(--ink); }
.update-notes p { margin: 8px 0; }
.update-notes ul, .update-notes ol { margin: 4px 0 8px; padding-left: 20px; }
.update-notes b { color: var(--ink); font-weight: 600; }
.whats-new .update-notes { max-height: min(52vh, 420px); }
.whats-new .update-notes h3.wn-version { margin-top: 14px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); }
.update-bar { height: 6px; border-radius: var(--pill); background: var(--raised-2); overflow: hidden; }
.update-bar[hidden] { display: none; }
.update-bar span { display: block; width: 0; height: 100%; background: var(--signal); transition: width .2s; }
.store-wait { margin: 10px 0 0; }
/* Views whose page runs under the top bar (for their big banner): a page without a banner starts below the bar. */
.app:is([data-view="store"], [data-view="wishlist"], [data-view="home"], [data-view="game"]) .page.no-hero { padding-top: calc(var(--top-h, 66px) + 28px); }
.pm-foot { padding: 10px 10px 4px; margin-top: 4px; border-top: 1px solid var(--rule); font-size: 11.5px; color: var(--ink-faint); }
/* First start: the welcome steps */
.dialog.setup { width: min(600px, calc(100vw - 32px)); padding: 28px; gap: 16px; }
.setup-logo svg { width: 30px; height: 46px; display: block; }
.dialog.setup h2 { font-size: 26px; letter-spacing: 0; }
.setup-found { display: flex; flex-wrap: wrap; gap: 8px; }
.setup-launcher { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: var(--pill); background: var(--raised); font-size: 13.5px; color: var(--ink); }
.setup-launcher i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.setup-launcher b { font-weight: 500; color: var(--ink-faint); }
.setup-signins { display: grid; gap: 8px; }
.setup-signin { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--raised); color: var(--ink); font: inherit; font-size: 15px; text-align: left; }
.setup-signin:hover, .setup-signin:focus-visible { background: var(--raised-2); }
.setup-signin .li { width: 22px; height: 22px; flex: none; color: var(--c, var(--ink-dim)); }
.setup-signin span { flex: 1; }
.setup-signin b { font-size: 13.5px; font-weight: 600; color: var(--signal); }
.setup-signin.done b { color: var(--good); font-weight: 500; }
.setup-opts { display: grid; gap: 10px; }
.setup-opts .check { font-size: 14px; color: var(--ink); }
.dialog.setup kbd.pad { font-size: 10px; padding: 3px 6px; }
.setup-foot { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.setup-dots { display: flex; gap: 6px; margin-right: auto; }
.setup-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--rule); }
.setup-dots i.on { background: var(--signal); }
/* The problem report */
.dialog.report { width: min(680px, calc(100vw - 32px)); }
.report-text { width: 100%; box-sizing: border-box; height: min(46vh, 380px); resize: none; background: var(--raised); color: var(--ink-dim); border: 1px solid var(--rule); border-radius: var(--radius); padding: 10px 12px; font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre; }
.clock { font: 600 15px/1 var(--font-body); font-variant-numeric: tabular-nums; color: var(--ink); margin-left: 8px; }
.btn { border-radius: var(--pill); }
.icon-btn { border-radius: 50%; }
h2 { font: 700 17px/1.2 var(--font-display); letter-spacing: 0; text-transform: none; color: var(--ink); }
.pill {
  display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: var(--pill); padding: 11px 22px;
  font: 700 15px/1 var(--font-body); background: color-mix(in srgb, var(--ink) 14%, transparent); color: var(--ink); backdrop-filter: blur(8px);
}
.pill:hover { background: color-mix(in srgb, var(--ink) 22%, transparent); }
.pill:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.pill.primary { background: var(--go); color: var(--on-go); padding-inline: 30px; }
.pill.primary:hover { filter: brightness(.92); }
.pill.round { padding-inline: 16px; }
a.pill { text-decoration: none; }
.pill svg { width: 15px; height: 15px; }

/* ---------- console look: Home ---------- */
.home { position: relative; min-height: 100%; overflow-anchor: none; }
.backdrop { position: absolute; inset: 0 0 auto 0; height: min(80vh, 780px); overflow: hidden; pointer-events: none; }
.backdrop img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .5s ease; }
.backdrop img.in { opacity: 1; }
.backdrop img.soft { filter: blur(34px) saturate(1.25); scale: 1.2; }
.backdrop::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, color-mix(in srgb, var(--ground) 92%, transparent) 0%, color-mix(in srgb, var(--ground) var(--wash-mid), transparent) var(--wash-mid-at), transparent var(--wash-end)),
              linear-gradient(0deg, var(--ground) 0%, color-mix(in srgb, var(--ground) var(--wash-bottom), transparent) var(--wash-bottom-at), transparent var(--wash-bottom-end));
}
.focus { position: relative; z-index: 1; display: grid; gap: 14px; align-content: end; max-width: 580px; min-height: clamp(300px, 46vh, 460px); padding: 100px var(--gutter-r) 26px calc(var(--gutter-l) + 16px); box-sizing: border-box; }
.focus .logo { max-width: min(340px, 80%); max-height: 150px; object-fit: contain; object-position: left bottom; filter: drop-shadow(0 6px 24px rgb(0 0 0 / .45)); }
.focus h1 { font: 800 clamp(32px, 4.6vw, 54px)/1.02 var(--font-display); letter-spacing: -.02em; text-wrap: balance; }
.focus p { margin: 0; color: var(--ink-dim); }
.focus .btns { display: flex; gap: 10px; flex-wrap: wrap; }
.rows { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1fr); gap: 26px; padding: 6px 0 48px; }
.hrow { min-width: 0; }
.hrow h2 { padding-left: calc(var(--gutter-l) + 16px); padding-right: var(--gutter-r); display: flex; gap: 10px; align-items: baseline; }
.hrow h2 i { font-style: normal; font-weight: 500; font-size: 13px; color: var(--ink-faint); }
.tiles { display: flex; gap: 14px; overflow-x: auto; padding: 10px var(--gutter-r) 14px calc(var(--gutter-l) + 16px); scroll-padding-inline: calc(var(--gutter-l) + 16px); scrollbar-width: none; scroll-snap-type: x proximity; }
.tiles::-webkit-scrollbar { display: none; }
/* Arrow buttons on sideways rows, for the mouse; shown while you point at the row, and only the way it can go. */
.has-arrows { position: relative; }
.strip-arrow { position: absolute; z-index: 3; translate: 0 -50%; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer; color: var(--ink); background: color-mix(in srgb, var(--ground) 82%, transparent);
  backdrop-filter: blur(8px); box-shadow: 0 4px 18px rgb(0 0 0 / .35); opacity: 0; transition: opacity .15s, background-color .15s, color .15s; }
.strip-arrow.prev { left: calc(var(--gutter-l) + 4px); }
.strip-arrow.next { right: calc(var(--gutter-r) + 4px); }
.strip-arrow svg { width: 20px; height: 20px; }
.has-arrows:hover > .strip-arrow { opacity: 1; }
.strip-arrow:hover { background: var(--ink); color: var(--ground); }
.strip-arrow[hidden] { display: none; }
@media (hover: none) { .strip-arrow { display: none; } }
.rows .all-games { margin-inline: calc(var(--gutter-l) + 16px) var(--gutter-r); }
.home .downloads { position: relative; z-index: 1; padding: 0 var(--gutter-r) 10px calc(var(--gutter-l) + 8px); max-width: 520px; }

/* ---------- console look: tiles ---------- */
.tile { flex: none; width: 112px; background: none; border: 0; padding: 0; display: grid; gap: 7px; align-content: start; text-align: left; color: var(--ink-dim); scroll-snap-align: start; }
.tile.big { width: 144px; }
.tile .art { position: relative; display: block; aspect-ratio: 2 / 3; border-radius: calc(12px * var(--round)); overflow: hidden; background: var(--raised); transition: transform .16s ease, box-shadow .16s ease; }
.tile .art img { width: 100%; height: 100%; object-fit: cover; }
.tile .art .line { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--c); opacity: .9; }
.tile.off .art img { filter: saturate(.55) brightness(.8); transition: filter .16s; }
.tile:hover .art, .tile:focus-visible .art { transform: scale(1.05); box-shadow: 0 0 0 3px var(--ink), 0 14px 30px -12px #000; }
.tile.off:hover .art img, .tile.off:focus-visible .art img { filter: none; }
.tile:focus-visible { outline: none; }
.tile .cap { font-size: 12.5px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile:hover .cap, .tile:focus-visible .cap { color: var(--ink); }
.rows .tile .cap { display: none; }
.tile .play-hint {
  position: absolute; right: 8px; bottom: 10px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  background: var(--go); color: var(--on-go); opacity: 0; translate: 0 4px; transition: opacity .15s, translate .15s; cursor: pointer;
}
.tile .play-hint svg { width: 14px; height: 14px; }
.tile.off .play-hint { background: var(--install); color: var(--on-install); }
.tile:hover .play-hint, .tile:focus-visible .play-hint { opacity: 1; translate: 0 0; }
.tile.all .art { display: grid; place-content: center; text-align: center; gap: 4px; background: color-mix(in srgb, var(--ink) 7%, transparent); border: 1px solid var(--rule); color: var(--ink-dim); font-weight: 600; font-size: 13px; box-sizing: border-box; }
.tile.all b { font-size: 26px; color: var(--ink); }
.tile.all.unneeded { display: none; }

/* ---------- console look: Library ---------- */
.library { position: relative; min-height: 100%; }
.library .backdrop { position: fixed; inset: 0; height: auto; opacity: .38; }
.library .backdrop img { filter: blur(44px) saturate(1.2); scale: 1.25; }
.lib-inner { position: relative; z-index: 1; display: grid; gap: 14px; padding-block: 18px 48px; padding-left: calc(var(--gutter-l) + 16px); padding-right: var(--gutter-r); }
.lhead { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.lhead h1 { font: 800 32px/1 var(--font-display); letter-spacing: -.02em; }
.lhead h1 span { font: 500 15px/1 var(--font-body); color: var(--ink-faint); margin-left: 8px; letter-spacing: 0; }
.seg { display: inline-flex; background: color-mix(in srgb, var(--ink) 9%, transparent); border-radius: var(--pill); padding: 3px; }
.seg button { background: none; border: 0; border-radius: var(--pill); padding: 7px 14px; font-weight: 600; font-size: 14px; color: var(--ink-dim); }
.seg button b { font-weight: 500; color: var(--ink-faint); margin-left: 3px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--ground); }
.seg button[aria-pressed="true"] b { color: inherit; opacity: .6; }
.lhead-tools { margin-left: auto; display: flex; gap: 12px; align-items: center; }
.fbar {
  position: sticky; top: 0; z-index: 3; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  margin-inline: calc(-1 * (var(--gutter-l) + 16px)) calc(-1 * var(--gutter-r)); padding: 12px var(--gutter-r) 12px calc(var(--gutter-l) + 16px);
  background: color-mix(in srgb, var(--ground) 84%, transparent); backdrop-filter: blur(16px); border-bottom: 1px solid var(--rule);
}
.fbar select { background: color-mix(in srgb, var(--ink) 7%, transparent); border: 1px solid var(--rule); border-radius: var(--pill); padding: 6px 12px; font-size: 13px; color: var(--ink); max-width: 200px; }
.fbar select option { background: var(--panel); color: var(--ink); }
.fbar .sep { width: 1px; height: 22px; background: var(--rule); margin-inline: 2px; }
.fbar .line-chip { padding: 5px 11px 5px 9px; }
.lsearch { position: relative; flex: 0 1 220px; }
.lsearch svg { position: absolute; left: 11px; top: 50%; translate: 0 -50%; width: 15px; height: 15px; color: var(--ink-faint); }
.lsearch input { width: 100%; box-sizing: border-box; background: color-mix(in srgb, var(--ink) 7%, transparent); border: 1px solid var(--rule); border-radius: var(--pill); padding: 7px 12px 7px 32px; font-size: 13.5px; }
.libchips { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.lbody { display: grid; grid-template-columns: minmax(0, 1fr) 24px; gap: 14px; align-items: start; }
.lbody.no-rail { grid-template-columns: minmax(0, 1fr); }
.lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 22px 16px; align-content: start; }
.lgrid.compact { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 16px 12px; }
.lgrid.compact .cap { font-size: 11.5px; }
.lgrid .tile { width: auto; }
/* The Library can hold hundreds of games: the browser skips laying out and painting the ones off screen.
   Each one's size is guessed until it has been on screen once, then remembered ("auto"). */
.lgrid > .tile { content-visibility: auto; contain-intrinsic-size: auto 124px auto 231px; }
.lrow { content-visibility: auto; contain-intrinsic-size: auto 600px auto 52px; }
.letter { grid-column: 1 / -1; margin: 12px 0 -6px; font: 800 22px/1 var(--font-display); color: var(--ink); scroll-margin-top: 84px; }
.list-view .letter { margin: 0; padding: 14px 14px 6px; font-size: 16px; border-top: 1px solid var(--rule); }
.azr { position: sticky; top: 76px; display: grid; gap: 1px; }
.azr button { background: none; border: 0; border-radius: calc(5px * var(--round)); padding: 3px 0; font: 700 11px/1 var(--font-display); color: var(--ink-dim); }
.azr button:hover:not(:disabled), .azr button:focus-visible { background: var(--ink); color: var(--ground); outline: none; }
.azr button:disabled { opacity: .28; cursor: default; }
.lib-hint { margin-top: 8px; }
.list-view { border-radius: calc(12px * var(--round)); }

/* ---------- console look: Home and Store open on one row, scrolling brings in the rest ---------- */
.home .backdrop { position: fixed; inset: 0; height: auto; }
.backdrop img { object-position: 50% 50%; }
/* Wide game art is shown whole, as wide as the screen and anchored to the top, fading out below,
   instead of being blown up to fill the full height (which cut off the sides and made it look too big). */
.home .backdrop img:not(.soft) { inset: 0 0 auto 0; height: auto; min-height: 50vh; object-position: 50% 0; -webkit-mask-image: linear-gradient(180deg, #000 60%, transparent); mask-image: linear-gradient(180deg, #000 60%, transparent); }
.backdrop .shade { position: absolute; inset: 0; z-index: 1; background: color-mix(in srgb, var(--ground) var(--shade), transparent); opacity: 0; transition: opacity .6s ease; }
.backdrop::after { z-index: 2; }
.home:not(.intro):not(.leaving) .backdrop .shade { opacity: 1; }
.home .focus { transition: min-height .6s cubic-bezier(.2, .7, .2, 1); }
/* Folding the rows away starts growing the panel at once, while the rows fade out. */
.home.intro .focus, .home.leaving .focus { min-height: var(--intro-h, calc(100vh - 320px)); }
/* Home's panel is as tall as its fullest version (logo, achievements, a news line) for every game,
   so going from game to game never moves the rows under it. --focus-h is measured in sizeIntro(). */
.games-home .focus { min-height: max(clamp(300px, 46vh, 460px), var(--focus-h, 0px)); }
.games-home.intro .focus, .games-home.leaving .focus { min-height: max(var(--intro-h, calc(100vh - 320px)), var(--focus-h, 0px)); }
.games-home .focus h1 { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; padding-bottom: .06em; }
/* The Store and the wishlist do the same, with the tallest game on the page measured (holdStorePanel). */
:is(.store-front, .wish-front) .focus { min-height: max(clamp(300px, 46vh, 460px), var(--focus-h, 0px)); }
.store-front.intro .focus, .store-front.leaving .focus { min-height: max(var(--intro-h, calc(100vh - 320px)), var(--focus-h, 0px)); }
:is(.store-front, .wish-front) .focus h1 { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; padding-bottom: .06em; }
.games-home .focus .meta { flex-wrap: nowrap; white-space: nowrap; overflow: hidden; }
.games-home .focus .ach-strip { flex-wrap: nowrap; overflow: hidden; }
.home.intro .rows { padding-bottom: 46px; }
.home.intro .later { display: none; }
.home.reveal .later { animation: row-in .6s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 70ms + 140ms); }
.home.leaving .later { opacity: 0; translate: 0 24px; transition: opacity .2s ease, translate .2s ease; }
@keyframes row-in { from { opacity: 0; translate: 0 36px; } }
.rows .tile .art .line { display: none; }
.scroll-hint { position: absolute; left: 50%; bottom: 8px; translate: -50% 0; z-index: 1; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-faint); background: none; border: 0; }
.scroll-hint svg { width: 14px; height: 14px; rotate: 90deg; }
.home:not(.intro) .scroll-hint { display: none; }
/* Home's first row starts with big covers and shrinks to the normal size when the other rows come in. */
.home:not(.store-front) .hrow:first-child .tile { transition: width .6s cubic-bezier(.2, .7, .2, 1); }
