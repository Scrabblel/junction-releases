.home.intro:not(.store-front) .hrow:first-child .tile, .home.leaving:not(.store-front) .hrow:first-child .tile { width: clamp(150px, min(13vw, 27vh), 236px); }
/* The Store's first row (after the search bar) does the same with its wide images. */
.store-front .rows > .hrow:nth-child(2) .tile { transition: width .6s cubic-bezier(.2, .7, .2, 1); }
.store-front.intro .rows > .hrow:nth-child(2) .tile { width: clamp(248px, min(21vw, 40vh), 380px); }
.home.measuring .tile, .home.measuring .focus { transition: none !important; }

/* Achievement icons come from a few sprite sheets. */
.aicon { flex: none; width: var(--s); height: var(--s); border-radius: calc(8px * var(--round)); background-color: var(--raised); background-repeat: no-repeat; }
.aicon.locked { filter: grayscale(1) brightness(.5); }
/* A launcher without pictures (EA): a star. */
.aicon.plain { display: grid; place-items: center; color: var(--signal); background-color: color-mix(in srgb, var(--ink) 10%, transparent); }
.aicon.plain svg { width: 52%; height: 52%; }
.aicon.secret { display: grid; place-items: center; font: 800 20px/1 var(--font-display); color: var(--ink); filter: none; background: color-mix(in srgb, var(--ink) 10%, transparent); }
.ach-strip { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 36px; }
.ach-strip .lbl { font-size: 12px; color: var(--ink-faint); margin: 0 4px 0 2px; }
.ach-strip .lbl + .aicon, .ach-strip .gap { margin-left: 0; }
.ach-strip .gap { width: 10px; }
.ach-full { display: grid; gap: 14px; max-width: 980px; }
.ach-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ach-head h2 { margin: 0; }
.ach-full > .btn { justify-self: start; }
.ach-head b { font: 700 15px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.ach-head .seg { margin-left: auto; }
.ach-head select { background: color-mix(in srgb, var(--ink) 7%, transparent); border: 1px solid var(--rule); border-radius: var(--pill); padding: 6px 12px; font-size: 13px; color: var(--ink); }
.ach-head select option { background: var(--panel); }
.ach-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 8px; }
.ach-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 12px 8px 8px; border-radius: calc(12px * var(--round)); background: color-mix(in srgb, var(--ink) 5%, transparent); }
.ach-item .txt { display: grid; gap: 2px; min-width: 0; }
.ach-item .txt b { font-weight: 600; font-size: 14px; color: var(--ink); }
.ach-item .txt span { font-size: 12.5px; color: var(--ink-dim); }
.ach-item.locked .txt b { color: var(--ink-dim); }
.ach-item .when { font-size: 12px; color: var(--ink-faint); text-align: right; white-space: nowrap; }
.ach-item .rare { color: var(--signal); }
.ach-item .reveal { background: none; border: 0; padding: 0; color: var(--ink-faint); text-decoration: underline; font-size: 12.5px; }

/* ---------- console look: Store front ---------- */
.app[data-view="store"] .main { grid-row: 1 / -1; }
.app.scrolled[data-view] .topbar { background: color-mix(in srgb, var(--ground) 86%, transparent); backdrop-filter: blur(14px); }
/* Library: the top bar, title row and filter bar all sit see-through on the blurred art. Once you scroll,
   the top bar and the stuck filter bar turn into one frosted strip. */
.app[data-view="library"] .topbar { background: transparent; }
.app[data-view="library"] .fbar { background: transparent; backdrop-filter: none; border-bottom-color: transparent; transition: background-color .2s ease, border-color .2s ease; }
.app.fbar-stuck[data-view="library"] .fbar { background: color-mix(in srgb, var(--ground) 86%, transparent); backdrop-filter: blur(14px); border-bottom-color: var(--rule); }
.app[data-view="store"] .topbar { background: linear-gradient(180deg, color-mix(in srgb, var(--ground) 78%, transparent), transparent); }
.tile.land { width: 248px; }
.tile.land .art { aspect-ratio: 240 / 112; }
.tile .art .ph { position: absolute; inset: 0; display: grid; place-items: center; font: 700 26px var(--font-display); color: var(--ink-faint); }
.tile .tag { position: absolute; left: 8px; bottom: 8px; display: inline-flex; gap: 6px; align-items: center; padding: 4px 9px; border-radius: var(--pill); font: 700 12.5px/1 var(--font-body); background: rgb(0 0 0 / .72); color: #fff; backdrop-filter: blur(6px); }
.tile .tag i { font-style: normal; color: var(--good); }
.tile .tag.free { background: var(--good); color: #062b14; }
.tile.land.owned .art img { filter: saturate(.5) brightness(.75); }
.store-tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 0 var(--gutter-r) 0 calc(var(--gutter-l) + 16px); }
.store-tools .lsearch { flex: 0 1 300px; }
.store-tools .note { margin-left: auto; }
:root[data-theme="light"] .store-tools :is(.note, .check) { background: color-mix(in srgb, var(--ground) 72%, transparent); border-radius: var(--pill); padding: 2px 10px; color: var(--ink-dim); }
@media (prefers-color-scheme: light) { :root:not([data-theme]) .store-tools :is(.note, .check) { background: color-mix(in srgb, var(--ground) 72%, transparent); border-radius: var(--pill); padding: 2px 10px; color: var(--ink-dim); } }
.hrow .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px var(--gutter-r) 0 calc(var(--gutter-l) + 16px); }
.focus .tags { font-size: 13px; color: var(--ink-faint); }
.focus .price-now { font: 800 22px/1 var(--font-display); color: var(--ink); }
.focus .price-now i { font-style: normal; font-size: 15px; color: var(--good); margin-right: 8px; }
.focus .price-now :is(s, .at) { font-size: 14px; font-weight: 500; color: var(--ink-faint); margin-left: 8px; }

/* ---------- console look: game, store and other pages ---------- */
.hero { min-height: clamp(380px, 64vh, 680px); aspect-ratio: auto; max-height: none; }
.hero::after { background: linear-gradient(90deg, color-mix(in srgb, var(--ground) 88%, transparent) 0%, color-mix(in srgb, var(--ground) 30%, transparent) 55%, transparent 80%), linear-gradient(0deg, var(--ground) 0%, transparent 50%); }
.hero { display: grid; }
.hero-inner { position: relative; min-height: inherit; box-sizing: border-box; padding-top: 86px; padding-bottom: 26px; padding-left: calc(var(--gutter-l) + 16px); gap: 18px; }
.hero:has(.capsule) { min-height: 0; }
.hero .title { font: 800 clamp(34px, 5vw, 60px)/1.02 var(--font-display); letter-spacing: -.02em; }
.back { border-radius: var(--pill); border: 0; background: color-mix(in srgb, var(--ink) 14%, transparent); backdrop-filter: blur(8px); }
.actionbar { background: var(--ground); border: 0; padding-left: calc(var(--gutter-l) + 16px); }
.game-body { padding-left: calc(var(--gutter-l) + 16px); }
.play { border-radius: var(--pill); background: var(--go); color: var(--on-go); font: 800 18px/1 var(--font-body); letter-spacing: .01em; padding: 14px 36px 14px 28px; box-shadow: 0 12px 30px -14px var(--game, #000); }
.play.install, .play.buy { background: var(--install); color: var(--on-install); }
.play:hover { filter: brightness(.94); }
.deal, .kpi, .panel, .wish, .list-view, .table-wrap, .palette, .dialog, .ctx { border-radius: calc(14px * var(--round)); }
.deal .img { border-radius: 0; }
.option { border-radius: calc(12px * var(--round)); }
.app[data-section="store"] .page, .app[data-section="wishlist"] .page, .app[data-section="stats"] .page {
  padding-left: calc(var(--gutter-l) + 16px); padding-right: calc(var(--gutter-r) + 8px); max-width: 1680px;
}

/* ---------- launcher badges, sale badges ---------- */
.lbadge { display: inline-flex; gap: 4px; vertical-align: middle; }
.lbadge i { font: 700 10.5px/1 var(--font-body); font-style: normal; letter-spacing: .02em; padding: 4px 7px 4px 6px; border-radius: var(--pill); background: color-mix(in srgb, var(--ink) 12%, transparent); color: var(--ink); display: inline-flex; align-items: center; gap: 5px; }
.lbadge i::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.tile .art .lbadge { position: absolute; left: 7px; top: 7px; opacity: 0; translate: 0 -3px; transition: opacity .15s, translate .15s; }
.tile .art .lbadge i { background: rgb(0 0 0 / .7); color: #fff; backdrop-filter: blur(6px); }
.tile:hover .art .lbadge, .tile:focus-visible .art .lbadge { opacity: 1; translate: 0 0; }
.tile .art .line { display: none; }
.sale { position: absolute; left: 7px; bottom: 8px; padding: 4px 8px; border-radius: var(--pill); font: 800 11px/1 var(--font-body); background: var(--good); color: #062b14; box-shadow: 0 4px 12px -4px #000; }
.lrow .sale { position: static; margin-left: 8px; vertical-align: middle; }
.focus .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ach-strip .lbl.count { font: 700 13px/1 var(--font-display); color: var(--ink); font-variant-numeric: tabular-nums; margin-right: 6px; }
.focus .trend { width: 180px; height: 26px; }
.focus .trend .spark { width: 100%; height: 100%; }

/* ---------- glide-in when the focused game changes ---------- */
@keyframes glide { from { opacity: 0; translate: 0 10px; } }
#focus > *, .gp-head > *, .ach-strip > * { animation: glide .42s cubic-bezier(.2, .7, .2, 1) backwards; }
#focus > :nth-child(2), .gp-head > :nth-child(2) { animation-delay: 45ms; }
#focus > :nth-child(3), .gp-head > :nth-child(3) { animation-delay: 90ms; }
#focus > :nth-child(4), .gp-head > :nth-child(4) { animation-delay: 135ms; }
#focus > :nth-child(5), .gp-head > :nth-child(5) { animation-delay: 180ms; }
#focus > :nth-child(n+6), .gp-head > :nth-child(n+6) { animation-delay: 220ms; }

/* ---------- Play feedback ---------- */
@keyframes shimmer-run { to { translate: 100% 0; } }
.launching { position: relative; overflow: hidden; pointer-events: none; }
.launching::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 20%, color-mix(in srgb, var(--on-go) 45%, transparent) 50%, transparent 80%); translate: -100% 0; animation: shimmer-run 1s ease-in-out infinite; }
.play-hint.launching, .lplay.launching { opacity: 1 !important; animation: pulse .8s ease-in-out infinite; }
@keyframes pulse { 50% { scale: 1.15; } }

/* ---------- Library: one-line filter bar with two small panels ---------- */
.pop { position: relative; }
.fsel { display: inline-flex; align-items: center; gap: 6px; background: color-mix(in srgb, var(--ink) 7%, transparent); border: 1px solid var(--rule); border-radius: var(--pill); padding: 6px 10px 6px 13px; font-size: 13px; color: var(--ink); }
.fsel b { font-weight: 700; background: var(--ink); color: var(--ground); border-radius: var(--pill); padding: 1px 6px; font-size: 11px; }
.fsel svg { width: 13px; height: 13px; rotate: 90deg; transition: rotate .15s; }
.fsel.on { border-color: var(--ink-dim); }
.pop.open .fsel svg { rotate: -90deg; }
.pop-panel { display: none; position: absolute; z-index: 6; top: calc(100% + 6px); left: 0; min-width: 230px; padding: 6px; border-radius: calc(14px * var(--round)); background: var(--panel); border: 1px solid var(--rule); box-shadow: 0 18px 40px -16px #000; }
.pop.open .pop-panel { display: grid; gap: 2px; animation: glide .18s ease-out backwards; }
.pop-opt { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 10px; text-align: left; background: none; border: 0; border-radius: calc(9px * var(--round)); padding: 8px 10px; font-size: 13.5px; color: var(--ink-dim); }
.pop-opt i { width: 10px; height: 10px; border-radius: calc(3px * var(--round)); border: 1.5px solid var(--ink-faint); box-sizing: border-box; }
.pop-opt[aria-pressed="true"] { color: var(--ink); }
.pop-opt[aria-pressed="true"] i { background: var(--c, var(--ink)); border-color: var(--c, var(--ink)); }
.pop-opt b { font-weight: 500; color: var(--ink-faint); font-size: 12px; }
.pop-opt:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.pop-panel .link-btn { justify-self: start; padding: 6px 10px; }
.pop-field { display: grid; gap: 6px; padding: 8px 10px; font-size: 12px; color: var(--ink-faint); }
.pop-field select { background: color-mix(in srgb, var(--ink) 7%, transparent); border: 1px solid var(--rule); border-radius: var(--pill); padding: 6px 12px; font-size: 13px; color: var(--ink); }
.fbar { flex-wrap: wrap; }

/* ---------- game page ---------- */
.gamepage { position: relative; min-height: 100%; }
.home .backdrop, .gamepage .backdrop, .statspage .backdrop { position: fixed; inset: 0; height: auto; }
.gamepage .backdrop img:not(.soft) { inset: 0 0 auto 0; height: auto; min-height: 50vh; object-position: 50% 0; -webkit-mask-image: linear-gradient(180deg, #000 60%, transparent); mask-image: linear-gradient(180deg, #000 60%, transparent); }
.gp-head { position: relative; z-index: 1; display: grid; gap: 14px; justify-items: start; align-content: end; max-width: 620px; min-height: clamp(360px, 58vh, 560px); box-sizing: border-box; padding: 86px var(--gutter-r) 22px calc(var(--gutter-l) + 16px); }
.gp-head.still > * { animation: none; }
.gp-head .back { margin-bottom: auto; padding: 9px 16px 9px 12px; font-size: 14px; }
.gp-head .logo { max-width: min(380px, 80%); max-height: 160px; object-fit: contain; object-position: left bottom; filter: drop-shadow(0 6px 24px rgb(0 0 0 / .45)); }
.gp-head h1 { font: 800 clamp(34px, 5vw, 58px)/1.02 var(--font-display); letter-spacing: -.02em; text-wrap: balance; }
.gp-head .meta { margin: 0; color: var(--ink-dim); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.gp-head .btns { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.gp-head .play-note { font-size: 13px; color: var(--ink-dim); }
.pill.big { font-size: 17px; padding: 14px 34px 14px 28px; box-shadow: 0 12px 30px -14px var(--game, #000); }
.pill.big svg { width: 17px; height: 17px; }
.pill.install { background: var(--install); color: var(--on-install); }
.pill.round[aria-pressed="true"] svg { color: var(--signal); }
.note-chip { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--ink); border: 0; border-radius: var(--pill); padding: 7px 14px; font-size: 13px; font-weight: 600; }
.note-chip:hover { background: color-mix(in srgb, var(--good) 26%, transparent); }
.gp-tabs { position: sticky; top: 0; z-index: 3; display: flex; gap: 4px; padding: 10px var(--gutter-r) 10px calc(var(--gutter-l) + 16px); background: color-mix(in srgb, var(--ground) 80%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--rule); }
.gp-tabs button { background: none; border: 0; border-radius: var(--pill); padding: 8px 16px; font: 600 14.5px/1 var(--font-body); color: var(--ink-dim); }
.gp-tabs button:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 8%, transparent); }
.gp-tabs button[aria-selected="true"] { background: var(--ink); color: var(--ground); }
.gp-panel { position: relative; z-index: 1; display: grid; gap: 18px; padding: 22px var(--gutter-r) 56px calc(var(--gutter-l) + 16px); background: var(--ground); min-height: 50vh; align-content: start; animation: glide .3s ease-out backwards; }
.gp-panel .facts { margin: 0; color: var(--ink-dim); }
.tab-hold { pointer-events: none; }
.gp-sec { display: grid; gap: 10px; max-width: 980px; }
.gp-sec h2 { margin: 0; }
.dlc-list { display: grid; gap: 6px; }
.dlc { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 12px; align-items: center; padding: 10px 14px; border-radius: calc(12px * var(--round)); background: color-mix(in srgb, var(--ink) 5%, transparent); color: var(--ink); text-decoration: none; font-size: 14px; }
.dlc:hover { background: color-mix(in srgb, var(--ink) 9%, transparent); }
.dlc .cut { color: var(--good); font-weight: 700; }
.dlc .was { color: var(--ink-faint); text-decoration: line-through; font-size: 12.5px; }
.manage .pill { font-size: 13.5px; padding: 9px 16px; }
.manage .pill svg { width: 15px; height: 15px; }
.app[data-view="game"] .gp-head .back { display: inline-flex; }

/* ---------- friends ---------- */
.face { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex: none; display: inline-grid; place-items: center; background: var(--raised); font: 700 11px/1 var(--font-body); color: var(--ink-dim); box-shadow: 0 0 0 2px var(--ground); }
.faces { display: inline-flex; }
.faces .face + .face { margin-left: -9px; }
.friends-line { margin: 0; display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--ink-dim); }
.friends-line b { color: var(--good); font-weight: 600; }
.friend-list { display: flex; flex-wrap: wrap; gap: 10px; }
.friend { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: var(--pill); background: color-mix(in srgb, var(--ink) 5%, transparent); }
.friend > span { display: grid; gap: 1px; font-size: 12.5px; color: var(--ink-faint); }
.friend b { color: var(--ink); font-size: 13.5px; font-weight: 600; }
.friends-btn { position: relative; }
.friends-btn .count { position: absolute; right: 2px; top: 2px; min-width: 16px; height: 16px; border-radius: var(--pill); background: var(--good); color: #062b14; font: 800 10px/16px var(--font-body); text-align: center; padding: 0 3px; box-sizing: border-box; }
.scrim.side { display: flex; justify-content: flex-end; align-items: stretch; padding: 0; }
.friends-panel { width: min(380px, 100vw); height: 100%; box-sizing: border-box; background: var(--panel); border-left: 1px solid var(--rule); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; padding: 18px 16px; animation: slide-in .25s cubic-bezier(.2, .7, .2, 1) backwards; }
@keyframes slide-in { from { translate: 40px 0; opacity: 0; } }
.fp-head { display: flex; align-items: center; justify-content: space-between; }
.fp-head h2 { margin: 0; font-size: 22px; }
.fp-head .icon-btn { font-size: 22px; line-height: 1; }
.fp-list { overflow-y: auto; display: grid; gap: 2px; align-content: start; }
.fp-group { font-size: 12px; font-weight: 700; color: var(--ink-faint); padding: 14px 8px 6px; }
.fp-group i { font-style: normal; font-weight: 500; }
.fp-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px; border-radius: calc(12px * var(--round)); background: none; border: 0; text-align: left; color: var(--ink); }
button.fp-row:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
.fp-row .face { width: 36px; height: 36px; }
.fp-text { display: grid; gap: 2px; min-width: 0; }
.fp-text b { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fp-text span { font-size: 12.5px; color: var(--ink-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fp-row.in-game .fp-text span { color: var(--good); }
.fp-row.online .fp-text span { color: var(--install); }
.fp-row:not(.in-game):not(.online) .face { opacity: .55; }
.fp-owns { font-size: 11.5px; color: var(--ink-faint); }

/* ---------- Store game page: other editions ---------- */
.editions { display: grid; gap: 10px; max-width: 760px; }
.editions h2 { margin: 6px 0 0; }
.edition-warn { margin: 0; padding: 10px 14px; border-radius: calc(12px * var(--round)); background: color-mix(in srgb, var(--signal) 16%, transparent); color: var(--ink); font-size: 14px; }
.edition-list { display: grid; gap: 6px; }
.edition { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 14px; align-items: center; text-align: left; padding: 10px 14px; border-radius: calc(12px * var(--round)); border: 0; background: color-mix(in srgb, var(--ink) 5%, transparent); color: var(--ink); font-size: 14px; }
.edition:hover { background: color-mix(in srgb, var(--ink) 9%, transparent); }
.edition i { font-style: normal; font-size: 11px; font-weight: 700; color: var(--good); margin-left: 6px; }
.edition .diff { font-size: 12.5px; color: var(--ink-faint); }
.edition .diff.less { color: var(--good); font-weight: 600; }

/* ---------- Wishlist in the Home style ---------- */
.app[data-view="wishlist"] .main { grid-row: 1 / -1; }
.app[data-view="wishlist"] .topbar { background: linear-gradient(180deg, color-mix(in srgb, var(--ground) 78%, transparent), transparent); }
.wish-front .rows { padding-top: 6px; }
.wish-note { padding: 0 var(--gutter-r) 0 calc(var(--gutter-l) + 16px); max-width: 80ch; }
.row-sort { margin-left: 8px; background: color-mix(in srgb, var(--ink) 7%, transparent); border: 1px solid var(--rule); border-radius: var(--pill); padding: 4px 10px; font: 500 12.5px var(--font-body); color: var(--ink); }
.row-sort option { background: var(--panel); }
.wish-front .backdrop .shade { opacity: .6; }

/* ---------- Stats in the new style ---------- */
.app[data-view="stats"] .topbar { background: transparent; }
.statspage { position: relative; min-height: 100%; }
.statspage .backdrop { opacity: .38; }
.statspage .backdrop img { filter: blur(44px) saturate(1.2); scale: 1.25; }
.st-inner { position: relative; z-index: 1; display: grid; gap: 26px; padding: 18px var(--gutter-r) 56px calc(var(--gutter-l) + 16px); }
.st-head h1 { font: 800 32px/1 var(--font-display); letter-spacing: -.02em; margin: 0 0 6px; }
.statspage .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px 24px; }
.statspage .kpi { background: none; border: 0; padding: 0; display: grid; gap: 4px; }
.statspage .kpi b { font: 800 clamp(30px, 3.4vw, 44px)/1 var(--font-display); letter-spacing: -.02em; color: var(--ink); font-variant-numeric: tabular-nums; }
.statspage .kpi span { font-size: 13.5px; color: var(--ink-dim); }
.statspage .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 16px; }
.card { display: grid; gap: 12px; align-content: start; padding: 18px; border-radius: calc(18px * var(--round)); background: color-mix(in srgb, var(--panel) 78%, transparent); backdrop-filter: blur(12px); border: 1px solid var(--rule); }
.card h2 { margin: 0; display: flex; gap: 8px; align-items: baseline; }
.card h2 i { font-style: normal; font-weight: 500; font-size: 13px; color: var(--ink-faint); }
.statspage .bt i { animation: grow .9s cubic-bezier(.2, .7, .2, 1) backwards; }
@keyframes grow { from { width: 0; } }

/* ---------- controller hints ---------- */
.pad-hints { pointer-events: none; position: fixed; z-index: 20; left: 50%; bottom: 14px; translate: -50% 0; display: flex; gap: 16px; padding: 8px 16px; border-radius: var(--pill); background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(12px); border: 1px solid var(--rule); font-size: 12.5px; color: var(--ink-dim); white-space: nowrap; }
.pad-hints span { display: inline-flex; align-items: center; gap: 6px; }
body:has(#layer > .scrim, #ctx) .pad-hints { display: none; }
body:has(#pad-hints) :is(#main, #cl-page, .cl-list, .filter-panel) { scroll-padding-bottom: 72px; }
/* Home and the Store front end on their rows: those get the room for the hints instead. */
body:has(#pad-hints) .home .rows { padding-bottom: 96px; }
body:has(#pad-hints) #main:not(:has(> :is(.home, .classic)))::after, body:has(#pad-hints) :is(#cl-page, .cl-list, .filter-panel)::after { content: ""; display: block; height: 56px; }
kbd.pad { font: 800 10.5px/1 var(--font-body); padding: 4px 6px; border-radius: var(--pill); background: var(--ink); color: var(--ground); border: 0; }

/* ---------- round 9: logos, news, tab markers, page slides ---------- */
/* D9: launcher logos instead of names */
.lbadge i { padding: 4px; gap: 0; }
.lbadge i::before { content: none; }
.lbadge .li { width: 13px; height: 13px; display: block; }
.meta .lbadge i { padding: 5px; background: color-mix(in srgb, var(--ink) 11%, transparent); }
.tile .art .lbadge i { padding: 5px; }
.pop-opt:has(.li) { grid-template-columns: 10px 15px minmax(0, 1fr) auto; }
.pop-opt .li { width: 15px; height: 15px; color: var(--ink-dim); }
.pop-opt[aria-pressed="true"] .li { color: var(--ink); }
/* D10: digits line up */
.tile .tag, .tile .sale, .tile .upd, .tile.all b, .price-now, .dlc, .meta, .play-note, .ach-strip, .ach-item .when, .fp-owns, .fp-text, .news-item .when,
.copy .txt, .bars, .bar-row, .kpi, .note-chip, .friends-line, .lhead h1 span, .seg b, .pop-opt b, .fsel b, .row-sort, .focus p, .cmd { font-variant-numeric: tabular-nums; }
/* F13: news */
.news { display: grid; gap: 10px; max-width: 860px; }
.news-item { display: grid; gap: 6px; justify-items: start; text-align: left; padding: 16px 18px; border-radius: calc(14px * var(--round)); background: color-mix(in srgb, var(--ink) 5%, transparent); color: var(--ink); text-decoration: none; transition: background .15s, translate .15s; }
.news-item:hover, .news-item:focus-visible { background: color-mix(in srgb, var(--ink) 9%, transparent); translate: 2px 0; }
.news-item .when { display: flex; gap: 10px; align-items: center; font-size: 12.5px; color: var(--ink-faint); }
.news-item .when i { font-style: normal; font-weight: 700; font-size: 11px; letter-spacing: .02em; padding: 3px 8px; border-radius: var(--pill); background: color-mix(in srgb, var(--ink) 10%, transparent); color: var(--ink-dim); }
.news-item .when i.patch { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--ink); }
.news-item b { font: 700 17px/1.25 var(--font-display); }
.news-item .txt { font-size: 14px; line-height: 1.5; color: var(--ink-dim); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.news-item .more { justify-self: start; font-size: 13px; font-weight: 600; color: var(--ink-faint); }
.news-item:hover .more { color: var(--ink); }
.tile .upd { position: absolute; left: 7px; bottom: 7px; max-width: calc(100% - 14px); box-sizing: border-box; display: grid; gap: 2px; padding: 6px 9px; border-radius: calc(10px * var(--round)); font: 500 11px/1.1 var(--font-body); background: rgb(0 0 0 / .74); color: rgb(255 255 255 / .8); backdrop-filter: blur(6px); white-space: nowrap; }
.tile .upd b { font-weight: 700; color: #fff; overflow: hidden; text-overflow: ellipsis; }
.note-chip.news { background: color-mix(in srgb, var(--ink) 10%, transparent); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.note-chip.news:hover { background: color-mix(in srgb, var(--ink) 16%, transparent); }
/* F14 */
.focus .why { color: var(--ink); font-weight: 600; font-size: 14px; }
/* D11: copies as cards, the technical bits folded away */
.copies { display: flex; flex-wrap: wrap; gap: 10px; }
.copy { display: flex; gap: 12px; align-items: center; padding: 12px 16px 12px 12px; border-radius: calc(14px * var(--round)); background: color-mix(in srgb, var(--ink) 5%, transparent); min-width: 220px; }
.copy .ico { width: 36px; height: 36px; border-radius: calc(10px * var(--round)); display: grid; place-items: center; background: color-mix(in srgb, var(--ink) 10%, transparent); color: var(--ink-dim); flex: none; }
.copy.on .ico { color: var(--ink); }
.copy .li { width: 18px; height: 18px; }
.copy .txt { display: grid; gap: 2px; }
.copy .txt b { font-size: 14.5px; }
.copy .txt span { font-size: 13px; color: var(--ink-dim); }
details.tech summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-faint); width: max-content; list-style: none; padding: 4px 0; }
details.tech summary::-webkit-details-marker { display: none; }
details.tech summary::before { content: "›"; display: inline-block; margin-right: 6px; transition: rotate .15s; }
details.tech[open] summary::before { rotate: 90deg; }
details.tech summary:hover { color: var(--ink); }
details.tech .tech-row .shop { font-size: 13px; color: var(--ink-dim); }
/* D12: empty states */

.bighome > .strip-arrow.prev { left: calc(var(--gutter-l) + 12px); }
.big-info { min-height: 0; max-width: 780px; align-content: start; padding: 6px var(--gutter-r) 26px calc(var(--gutter-l) + 56px); }
.big-info h1 { font-size: clamp(40px, 4.6vw, 60px); }
.big-info .logo { max-height: 140px; }
.big-info .meta { font-size: 17px; }
.big-info .btns .pill { padding: 12px 24px; font-size: 17px; }

/* Downloads beside the game, not below it where they'd fall off a TV's screen. */

.big-lower .big-info { flex: 1 1 auto; min-width: 0; }
.bighome .downloads { flex: 0 1 380px; min-width: 260px; margin-top: 14px; }
@media (max-width: 1000px) { .big-lower { flex-wrap: wrap; } .bighome .downloads { flex-basis: 100%; margin-left: calc(var(--gutter-l) + 56px); } }
html[data-layout="big"] .app:is([data-view="home"]) .topbar { background: none; border-color: transparent; }
html[data-style="glass"] .big-info { flex: 0 1 auto; margin-left: calc(var(--gutter-l) + 36px); padding: 22px 26px; background: rgb(16 21 30 / .5);
  border: 1px solid var(--rule); border-radius: var(--radius); backdrop-filter: blur(26px) saturate(1.3); }
html[data-style="mono"] .bighome .backdrop img { filter: blur(40px) grayscale(1) brightness(.7); }
html[data-style="sharp"] .big-rail .tile:focus-visible .art { box-shadow: 0 24px 50px -16px #000; }

.classic.cl-wide { grid-template-columns: minmax(0, 1fr); }
.cl-home { padding: 22px var(--gutter-r) 0 calc(var(--gutter-l) + 16px); }
.cl-home-in { width: 100%; max-width: 1240px; margin: 0 auto; display: grid; gap: 30px; padding-bottom: 44px; min-width: 0; }
.cc-label { font: 600 11px/1 var(--font-display); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); }
.cc-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
/* Featured: a big picture with the game's details beside it, like a store's front page. */
.cl-feat { position: relative; display: grid; gap: 12px; }
.cl-feat-card { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(260px, 1fr); min-height: clamp(260px, 40vh, 420px); border-radius: var(--radius); overflow: hidden;
  background: var(--panel); border: 1px solid var(--rule); box-shadow: 0 24px 60px -30px rgb(0 0 0 / .6); }
.cl-feat-art { position: relative; border: 0; padding: 22px 26px; display: flex; align-items: flex-end; background: var(--raised) center / cover no-repeat; min-height: 100%; }
.cl-feat-art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgb(0 0 0 / .45), transparent 45%); transition: background .2s; }
.cl-feat-art:hover::after { background: linear-gradient(0deg, rgb(0 0 0 / .3), transparent 45%); }
.cl-feat-art:focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }
.cl-feat-art .logo { position: relative; z-index: 1; max-width: min(320px, 70%); max-height: 120px; object-fit: contain; object-position: left bottom; filter: drop-shadow(0 4px 18px rgb(0 0 0 / .55)); }
.cl-feat-side { display: flex; flex-direction: column; align-items: stretch; gap: 10px; padding: 24px 24px 22px; min-width: 0; }
.cl-feat-side > :not(.cl-feat-news) { align-self: flex-start; }
.cl-feat-side h2 { margin: 0; font: 800 clamp(22px, 2.2vw, 30px)/1.1 var(--font-display); letter-spacing: -.01em; color: var(--ink); text-wrap: balance; }
.cl-feat-meta { margin: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--ink-dim); font-size: 14px; }
.cl-feat-news { display: grid; gap: 4px; text-align: left; padding: 10px 12px; border-radius: calc(8px * var(--round)); border: 1px solid var(--rule); background: color-mix(in srgb, var(--ink) 5%, transparent);
  color: var(--ink); font-size: 13.5px; font-weight: 600; line-height: 1.3; }
.cl-feat-news i { font-style: normal; font-weight: 600; font-size: 11.5px; color: var(--signal); text-transform: uppercase; letter-spacing: .08em; }
.cl-feat-news:hover { border-color: var(--ink-faint); }
.cl-feat .cc-btns { margin-top: auto; padding-top: 6px; }
.cl-feat-arrow { position: absolute; top: calc(50% - 22px); translate: 0 -50%; z-index: 2; width: 40px; height: 64px; display: grid; place-items: center; padding: 0; border: 0;
  border-radius: calc(8px * var(--round)); background: rgb(0 0 0 / .45); color: #fff; backdrop-filter: blur(8px); opacity: .75; }
.cl-feat-arrow svg { width: 20px; height: 20px; }
.cl-feat-arrow.prev { left: 10px; }
.cl-feat-arrow.next { left: calc(63.6% - 50px); }
.cl-feat-arrow:hover, .cl-feat-arrow:focus-visible { opacity: 1; background: rgb(0 0 0 / .7); }
.cl-dots { display: flex; justify-content: center; gap: 6px; }
.cl-dots button { width: 22px; height: 6px; padding: 0; border: 0; border-radius: 3px; background: color-mix(in srgb, var(--ink) 22%, transparent); }
.cl-dots button[aria-current] { background: var(--ink); width: 34px; }
.cl-dots button:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }
/* Played before: wide capsules with the game's header art. */
.cl-caps { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px 14px; }
.cl-cap { display: grid; gap: 4px; padding: 0; border: 0; background: none; text-align: left; color: var(--ink-dim); min-width: 0; }
.cl-cap .img { position: relative; display: block; aspect-ratio: 460 / 215; border-radius: calc(8px * var(--round)); overflow: hidden; background: var(--raised); transition: transform .16s ease, box-shadow .16s ease; }
.cl-cap .img img { width: 100%; height: 100%; object-fit: cover; }
.cl-cap .img .ph { position: absolute; inset: 0; display: grid; place-items: center; font: 700 22px var(--font-display); color: var(--ink-faint); }
.cl-cap .img .badge, .cl-cap .img > span:not(.ph) { position: absolute; left: 6px; top: 6px; }
.cl-cap.off .img img { filter: saturate(.55) brightness(.8); }
.cl-cap .nm { margin-top: 4px; font-size: 13.5px; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cl-cap .sub { font-size: 12.5px; color: var(--ink-faint); }
.cl-cap:hover .img, .cl-cap:focus-visible .img { transform: scale(1.03); box-shadow: 0 0 0 3px var(--ink), 0 14px 30px -12px #000; }
.cl-cap:focus-visible { outline: none; }
/* News from your games */
.cl-news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 12px; }
.cl-news { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 14px; align-items: start; padding: 10px; text-align: left; border-radius: var(--radius);
  border: 1px solid var(--rule); background: color-mix(in srgb, var(--panel) 88%, transparent); color: var(--ink-dim); }
.cl-news .img { aspect-ratio: 460 / 215; border-radius: calc(6px * var(--round)); overflow: hidden; background: var(--raised); }
.cl-news .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cl-news .txt { display: grid; gap: 4px; min-width: 0; }
.cl-news .when { font-size: 12px; color: var(--ink-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cl-news .when i { font-style: normal; font-weight: 700; color: var(--ink-dim); margin-right: 6px; }
.cl-news .when i.patch { color: var(--signal); }
.cl-news b { color: var(--ink); font-size: 14px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cl-news .sn { font-size: 12.5px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cl-news:hover { border-color: var(--ink-faint); }
.cl-news:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
@media (max-width: 1100px) { .cl-feat-card { grid-template-columns: minmax(0, 1.3fr) minmax(240px, 1fr); } .cl-feat-arrow.next { left: calc(56.5% - 50px); } }
html[data-style="glass"] :is(.cl-feat-card, .cl-news) { background: rgb(16 21 30 / .5); backdrop-filter: blur(24px) saturate(1.3); }
html[data-style="mono"] :is(.cl-feat-art, .cl-cap .img img, .cl-news .img img) { filter: grayscale(1); }
html[data-style="sharp"] :is(.cl-feat-card, .cl-cap .img, .cl-news) { --cut: 12px; clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); }
html[data-style="sharp"] .cl-dots button[aria-current] { background: var(--signal); }
.cl-dl:not([hidden]) { display: grid; gap: 8px; }
/* Best deals for you: a banner of discounted games under the carousel. */
.cl-deals { display: grid; gap: 14px; padding: 18px 20px 20px; border-radius: var(--radius); border: 1px solid var(--rule);
  background: linear-gradient(120deg, color-mix(in srgb, var(--good) 16%, var(--panel)), var(--panel) 55%); }
.cl-deal-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.cl-deal { display: grid; align-content: start; gap: 5px; padding: 0; border: 0; background: none; text-align: left; color: var(--ink-dim); min-width: 0; }
.cl-deal .img { position: relative; display: block; aspect-ratio: 460 / 215; border-radius: calc(8px * var(--round)); overflow: hidden; background: var(--raised); transition: transform .16s ease, box-shadow .16s ease; }
.cl-deal .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cl-deal .img .ph { position: absolute; inset: 0; display: grid; place-items: center; font: 700 22px var(--font-display); color: var(--ink-faint); }
.cl-deal .cut { position: absolute; left: 8px; bottom: 8px; padding: 3px 8px; border-radius: var(--pill); background: var(--good); color: #062b14; font: 800 13px/1.2 var(--font-body); }
.cl-deal .nm { margin-top: 4px; font-size: 13.5px; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cl-deal .pr { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 13px; }
.cl-deal .pr .was { color: var(--ink-faint); text-decoration: line-through; }
.cl-deal .pr b { color: var(--ink); font-size: 15px; }
.cl-deal .pr .low { font-size: 11.5px; font-weight: 700; color: var(--good); }
.cl-deal .why { font-size: 12px; color: var(--ink-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cl-deal:hover .img, .cl-deal:focus-visible .img { transform: scale(1.03); box-shadow: 0 0 0 3px var(--ink), 0 14px 30px -12px #000; }
.cl-deal:focus-visible { outline: none; }
html[data-style="glass"] .cl-deals { background: rgb(16 21 30 / .5); backdrop-filter: blur(24px) saturate(1.3); }
html[data-style="mono"] .cl-deals { background: var(--panel); }
html[data-style="mono"] .cl-deal .img img { filter: grayscale(1); }
html[data-style="mono"] .cl-deal .cut { background: var(--ink); color: var(--ground); }
html[data-style="sharp"] :is(.cl-deals, .cl-deal .img) { --cut: 12px; clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); }
.cl-sec { display: grid; gap: 12px; min-width: 0; }
.cl-sec-head { display: flex; align-items: baseline; gap: 10px; }
.cl-sec-head h2 { margin: 0; font: 700 18px/1.2 var(--font-display); color: var(--ink); }
.cl-sec-head i { font-style: normal; font-size: 13px; color: var(--ink-faint); }
.cl-sec-head .link-btn { margin-left: auto; font-size: 13px; }
.cl-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 16px 14px; }
.cl-tiles.land { grid-template-columns: repeat(4, minmax(0, 1fr)); }
/* Column counts that the rows divide into (12 played, 8 suggestions, 5 deals), so no row ends half empty. */
@media (max-width: 1200px) { .cl-caps { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 700px) { .cl-caps, .cl-tiles.land, .cl-deal-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.cl-tiles .tile, .cl-tiles .tile.land { width: auto; }
.classic .gp-tabs { margin: 4px calc(-1 * var(--gutter-r)) 0 -26px; padding-left: 26px; }
.classic .gp-panel { padding: 16px 0 48px; background: none; min-height: 0; animation: none; }
html[data-style="glass"] .classic .gp-panel { background: none; backdrop-filter: none; border: 0; }
html[data-style="glass"] .classic .backdrop { opacity: .6; }
html[data-style="glass"] :is(.cl-side, .cl-stat) { background: rgb(16 21 30 / .5); backdrop-filter: blur(24px) saturate(1.3); }
html[data-style="mono"] .cl-banner { filter: grayscale(1); }
html[data-style="sharp"] :is(.cl-banner, .cl-stat, .cl-search input, .cl-chips button) { clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); }
html[data-style="sharp"] .cl-banner { --cut: 18px; }
html[data-style="sharp"] .cl-chips button[aria-pressed="true"] { background: var(--signal); border-color: var(--signal); color: var(--on-go); }
html[data-style="sharp"] .cl-row[aria-current] { background: linear-gradient(90deg, color-mix(in srgb, var(--signal) 24%, transparent), transparent); }

/* ---------- styles (Preferences › Style): the same pages in another look ----------
   Each style sets the colours, fonts and corners above, then a few rules of its own. They're always dark. */

/* Glass: frosted, see-through panels, with the game's art showing through on every page. */
:root[data-style="glass"] {
  --ground: #0b0f16; --panel: rgb(16 21 30 / .62); --raised: rgb(255 255 255 / .07); --raised-2: rgb(255 255 255 / .13); --rule: rgb(255 255 255 / .12);
  --ink: #f6f8fb; --ink-dim: #c6cfdb; --ink-faint: #8f9bad; --signal: #ffc24a;
  --go: rgb(255 255 255 / .94); --go-deep: rgb(232 237 243 / .94);
  --font-display: "Figtree", "Segoe UI", system-ui, sans-serif; --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --radius: 16px; --round: 1.35;
  --wash-mid: 30%; --wash-end: 72%; --wash-bottom: 45%;
}
html[data-style="glass"] :is(.ctx, .dialog, .toast, .pad-hints, .palette, .pop-panel) {
  background: rgb(20 26 36 / .74); border-color: rgb(255 255 255 / .14); backdrop-filter: blur(26px) saturate(1.4);
}
html[data-style="glass"] .scrim { background: rgb(4 6 10 / .45); backdrop-filter: blur(6px); }
html[data-style="glass"] :is(.btn, .icon-btn, .seg, .pill:not(.primary)) { background: rgb(255 255 255 / .1); border-color: rgb(255 255 255 / .14); backdrop-filter: blur(12px); }
html[data-style="glass"] :is(.btn, .icon-btn, .pill:not(.primary)):hover { background: rgb(255 255 255 / .18); }
html[data-style="glass"] .library .backdrop { opacity: .62; }
/* A frosted pane over the left of the art, where the game's name and buttons sit, and a frosted shelf under the rows. */
html[data-style="glass"] :is(.home, .gamepage) .backdrop::before {
  content: ""; position: absolute; inset: 0; z-index: 1; background: rgb(10 14 20 / .18); backdrop-filter: blur(26px) saturate(1.35);
  -webkit-mask-image: linear-gradient(90deg, #000 0 30%, transparent 56%); mask-image: linear-gradient(90deg, #000 0 30%, transparent 56%);
}
html[data-style="glass"] .home .rows {
  margin-inline: calc(var(--gutter-l) + 4px) var(--gutter-r); padding-top: 18px; padding-bottom: 22px; border-radius: var(--radius);
  background: rgb(14 19 28 / .4); border: 1px solid rgb(255 255 255 / .1); backdrop-filter: blur(24px) saturate(1.4);
}
html[data-style="glass"] .home .rows :is(.tiles, .hrow h2) { padding-left: 22px; scroll-padding-inline: 22px; }
html[data-style="glass"] .gp-panel { background: rgb(12 16 24 / .55); backdrop-filter: blur(30px) saturate(1.3); border-top: 1px solid rgb(255 255 255 / .1); }
html[data-style="glass"] .gp-tabs { background: rgb(12 16 24 / .45); }
html[data-style="glass"] .ach-item { background: rgb(255 255 255 / .06); border: 1px solid rgb(255 255 255 / .08); }
html[data-style="glass"] .tile .art { box-shadow: 0 16px 34px -18px rgb(0 0 0 / .8); }
html[data-style="glass"] .tile:hover .art, html[data-style="glass"] .tile:focus-visible .art {
  box-shadow: 0 0 0 2px rgb(255 255 255 / .92), 0 0 34px -6px rgb(255 255 255 / .35), 0 18px 34px -14px #000;
}

/* Monochrome: black, white and grey. Covers are grey until you point at one; thin lines and plain type. */
:root[data-style="mono"] {
  --ground: #0b0b0b; --panel: #111111; --raised: #171717; --raised-2: #212121; --rule: #2b2b2b;
  --ink: #f2f2f2; --ink-dim: #a6a6a6; --ink-faint: #6c6c6c; --signal: #f2f2f2;
  --go: #f2f2f2; --go-deep: #dcdcdc; --on-go: #0b0b0b; --install: #f2f2f2; --install-deep: #dcdcdc; --on-install: #0b0b0b;
  --good: #f2f2f2; --cut-bg: #f2f2f2; --cut-ink: #0b0b0b;
  --line-steam: #8c8c8c; --line-epic: #8c8c8c; --line-gog: #8c8c8c; --line-ubisoft: #8c8c8c; --line-ea: #8c8c8c;
  --line-battlenet: #8c8c8c; --line-rockstar: #8c8c8c; --line-xbox: #8c8c8c; --line-manual: #8c8c8c;
  --font-display: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --radius: 2px; --round: .17; --pill: 2px; --title-shadow: none;
}
html[data-style="mono"] :is(.tile .art img, .cover img, .backdrop img, .focus .logo, .gp-head .logo, .aicon, .avatar img, .friends-line img) { filter: grayscale(1) contrast(1.04); }
html[data-style="mono"] :is(.tile:hover, .tile:focus-visible) .art img { filter: none; }
html[data-style="mono"] .tile .art { transition: outline-color .16s; outline: 1px solid transparent; outline-offset: 4px; }
html[data-style="mono"] :is(.tile:hover, .tile:focus-visible) .art { transform: none; box-shadow: none; outline-color: var(--ink); }
html[data-style="mono"] :is(.hrow h2, .ctx-label, .lhead h1 span) { font-family: var(--font-mono); font-weight: 500; }
html[data-style="mono"] .hrow h2 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
html[data-style="mono"] .pill.primary { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
html[data-style="mono"] .pill.primary:hover { background: var(--ink); color: var(--ground); filter: none; }
html[data-style="mono"] :is(.focus h1, .lhead h1, h1) { font-weight: 500; letter-spacing: -.01em; }

/* Sharp: cut corners, tall narrow capitals and amber highlights, like a game's own menus. */
:root[data-style="sharp"] {
  --ground: #07090d; --panel: #0e1218; --raised: #151a22; --raised-2: #1d232d; --rule: #283040;
  --ink: #f4f5f7; --ink-dim: #a9b1bd; --ink-faint: #6c7584; --signal: #ffb21d;
  --go: #ffb21d; --go-deep: #f2a100; --on-go: #140d00;
  --font-display: "Barlow Condensed", "Arial Narrow", "Segoe UI", sans-serif; --font-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --radius: 0px; --round: 0; --pill: 0px;
  --cut: 10px;
}
html[data-style="sharp"] :is(.tile .art, .pill, .btn, .play, .seg, .has-ind > .ind, .gp-tabs button, .dialog, .toast, .pad-hints, .strip-arrow, .back) {
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
}
html[data-style="sharp"] .tile .art { --cut: 14px; }
html[data-style="sharp"] :is(.icon-btn, .avatar, button.avatar) { border-radius: 0; }
html[data-style="sharp"] .tile .art::after { content: ""; position: absolute; inset: 0; border: 3px solid var(--signal); opacity: 0; transition: opacity .12s; pointer-events: none; }
html[data-style="sharp"] :is(.tile:hover, .tile:focus-visible) .art { box-shadow: none; }
html[data-style="sharp"] :is(.tile:hover, .tile:focus-visible) .art::after { opacity: 1; }
html[data-style="sharp"] :is(h1, h2, .nav button, .pill, .btn, .play, .gp-tabs button, .seg button, .lhead h1) { text-transform: uppercase; letter-spacing: .05em; }
html[data-style="sharp"] :is(.focus h1, .lhead h1, h1) { font-weight: 700; letter-spacing: .01em; }
html[data-style="sharp"] h2 { font-weight: 600; }
html[data-style="sharp"] .has-ind > .ind { background: var(--signal); }
html[data-style="sharp"] :is(.nav.has-ind button[aria-current="page"], .gp-tabs.has-ind button[aria-selected="true"], .lhead .seg.has-ind button[aria-pressed="true"]) { color: var(--on-go); }
html[data-style="sharp"] .pill.primary { background: var(--go); color: var(--on-go); }
/* Uninstall and Stop are red: they remove or end something. */
.ctx button.danger, .pill#uninstall, .link-btn#uninstall { color: var(--danger); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
.btn.danger:hover { filter: brightness(1.08); background: var(--danger); }
/* A game Junction started: Starting…, then Playing (press it to switch to the game), with a cross that closes it.
   Pointing at the cross turns the whole button red and it says Stop. */
.run-group { display: inline-flex; align-items: stretch; gap: 2px; vertical-align: middle; }
html .run-group > .pill.running { background: var(--good); color: #052414; border-color: var(--good); border-top-right-radius: calc(4px * var(--round)); border-bottom-right-radius: calc(4px * var(--round)); }
html .run-group > .pill.stop-x { display: grid; place-items: center; padding: 0 14px; min-width: 0; background: var(--good); color: #052414; border-color: var(--good);

<script>
// ---------- host: the same page runs as an artifact (snapshot data) and inside the desktop app ----------
const host = {
  inApp: false,
  async ready() {
    if (window.pywebview && window.pywebview.api) { this.inApp = true; return; }
    await new Promise(resolve => {
      const done = () => resolve();
      window.addEventListener('pywebviewready', () => { this.inApp = true; done(); }, { once: true });
      // Opened as a file, the page is the desktop app's: give the app time to connect.
      setTimeout(done, location.protocol === 'file:' ? 15000 : 400);
    });
  },
  async library() {
    if (this.inApp) return window.pywebview.api.get_library();
    const res = await fetch('library.json');
    return res.json();
  },
  async play(game, steamId) {
    if (this.inApp) return window.pywebview.api.play(game.id, steamId || null, game.launcher === 'manual' ? game.launch : null);
    return { prototype: true };
  },
  async install(game, steamId) {
    if (this.inApp) return window.pywebview.api.install(game.id, steamId || null, game.launcher === 'manual' ? game.launch : null);
    return { prototype: true };
  },
  async running() {
    if (this.inApp) return window.pywebview.api.get_running();
    return {};
  },
  async focusGame(id) {
    if (this.inApp) return window.pywebview.api.focus_game(id);
    return { prototype: true };
  },
  async stopGame(id) {
    if (this.inApp) return window.pywebview.api.stop_game(id);
    return { prototype: true };
  },
  async openFolder(game) {
    if (this.inApp) return window.pywebview.api.open_folder(game.id, game.launcher === 'manual' ? game.launch : null);
    return { prototype: true };
  },
  async downloads() {
    if (this.inApp) return window.pywebview.api.get_downloads();
    return null;
  },
  async rescan() {
    if (this.inApp) return window.pywebview.api.rescan();
    return null;
  },
  async pickProgram() {
    if (this.inApp) return window.pywebview.api.pick_program();
    return null;
  },
  async achievements(appid) {
    if (this.inApp) return window.pywebview.api.get_achievements(appid ?? null);
    const res = await fetch('achievements.json');
    return res.json();
  },
  async priceHistory(id) {
    if (this.inApp) return window.pywebview.api.get_price_history(id);
    return null;
  },
  async store() {
    if (this.inApp) return window.pywebview.api.get_store();
    const res = await fetch('store.json');
    return res.json();
  },
  // Screenshots and a trailer clip for any Steam game; the artifact only has installed games'.
  async media(appid) {
    if (this.inApp) return window.pywebview.api.get_media(appid);
    return null;
  },
  // Live search across every game IsThereAnyDeal knows, as Store games. The artifact only searches its snapshot.
  async searchPrices(query) {
    if (this.inApp) return window.pywebview.api.search_prices(query);
    return null;
  },
  // Today's prices for Store games outside the snapshot: {itadId: {deals, historyLow}}.
  async prices(ids) {
    if (this.inApp) return window.pywebview.api.get_prices(ids);
    return null;
  },
  async dealAlert(title, text) { return this.inApp ? window.pywebview.api.deal_alert(title, text) : null; },
  // API keys: the app checks and saves them; the page only ever sees their last four characters.
  async settings() {
    return this.inApp ? window.pywebview.api.get_settings() : null;
  },
  async setCountry(code) { return this.inApp ? window.pywebview.api.set_country(code) : { error: 'Only the Junction app can change this.' }; },
  async setKey(kind, steamId, key) {
    if (!this.inApp) return { error: 'Only the Junction app can save keys.' };
    const api = window.pywebview.api;
    return kind === 'steam' ? api.set_steam_key(steamId, key) : kind === 'prices' ? api.set_prices_key(key) : api.set_art_key(key);
  },
  async openUrl(url) {
    if (this.inApp) return window.pywebview.api.open_url(url);
    Window.prototype.open.call(window, url, '_blank', 'noopener');
  },
  // On/off settings (tray, start with Windows, setup done), and the problem report.
  async removeAccount(steamId) { return this.inApp ? window.pywebview.api.remove_steam_account(steamId) : null; },
  async uninstall(game) { return this.inApp ? window.pywebview.api.uninstall(game.id) : { prototype: true }; },
  async setEarlierPlaytime(id, hours) { return this.inApp ? window.pywebview.api.set_earlier_playtime(id, hours) : null; },
  // Launcher sign-ins (Epic, EA, Ubisoft) for their play time: the sign-in happens on the store's own page, in a window of its own.
  async signIn(store) { return this.inApp ? window.pywebview.api.sign_in(store) : { error: 'Only the Junction app can sign in.' }; },
  async signOut(store) { return this.inApp ? window.pywebview.api.sign_out(store) : null; },
  async restoreAccount(steamId) { return this.inApp ? window.pywebview.api.restore_steam_account(steamId) : null; },
  async setOption(name, value) {
    return this.inApp ? window.pywebview.api.set_option(name, value) : null;
  },
  async problemReport() { return this.inApp ? window.pywebview.api.problem_report() : ''; },
  async copyReport() { return this.inApp ? window.pywebview.api.copy_report() : null; },
  async showReport() { return this.inApp ? window.pywebview.api.show_report() : null; },
  logError(message) { if (this.inApp) window.pywebview.api.log_error(String(message)).catch?.(() => {}); },
  async showWindow() { return this.inApp ? window.pywebview.api.show_window() : null; },
  async windowInfo() { return this.inApp ? window.pywebview.api.window_info() : null; },
  // Big screen: full screen, and the page zoomed to the screen. `full` switches only full screen (F11).
  async bigScreen(on, full) { return this.inApp ? window.pywebview.api.big_screen(on, full ?? null) : null; },
  async fitBigScreen() { return this.inApp ? window.pywebview.api.fit_big_screen() : null; },
  windowAction(what) { return this.inApp ? window.pywebview.api.window_action(what) : null; },
  async updateInfo() { return this.inApp ? window.pywebview.api.update_info() : null; },
  async whatsNew() { return this.inApp ? window.pywebview.api.whats_new() : null; },
  async checkUpdates() { return this.inApp ? window.pywebview.api.check_updates() : null; },
  async installUpdate() { return this.inApp ? window.pywebview.api.install_update() : null; },
};

const LAUNCH_VIA = {
  steam: 'Steam', epic: 'the Epic Games Launcher', gog: 'GOG Galaxy', ubisoft: 'Ubisoft Connect',
  ea: 'the EA app', battlenet: 'Battle.net', rockstar: 'the Rockstar Games Launcher', xbox: 'the Xbox app', manual: 'its own program',
};
// What INSTALL does per launcher: [game page explanation, toast once started].
const INSTALL_VIA = {
  steam: ['INSTALL asks Steam to download the game.', n => `Steam is opening the download for ${n}.`],
  epic: ['INSTALL opens the Epic Games Launcher on the game, ready to install.', n => `The Epic Games Launcher is opening ${n}.`],
  gog: ["INSTALL opens the game's page in GOG Galaxy. Click Install there.", n => `GOG Galaxy is opening ${n}.`],
  ubisoft: ['INSTALL asks Ubisoft Connect to install the game.', n => `Ubisoft Connect is opening the install for ${n}.`],
};

// ---------- per-viewer preferences (favourites, hidden games, collections, layout, theme) ----------
const PREFS_KEY = 'junction.prefs.v1';
// Which launcher's copy a game uses when you own it on several, first wins. Installed copies always go first.
const LAUNCHER_ORDER = ['steam', 'gog', 'epic', 'ubisoft', 'ea', 'battlenet', 'rockstar', 'xbox', 'manual'];
function loadPrefs() {
  const defaults = { favorites: [], hidden: [], shown: [], manual: [], sort: 'recent', scope: 'all',
                     wishlist: [], unwished: [], showOwned: false,
                     launcherOrder: LAUNCHER_ORDER.slice(), collections: [], density: 'covers', theme: 'dark',
                     layout: 'console', style: 'junction',
                     uninstalledOpen: true, showFilters: false, accountsOpen: false, playWith: {}, wishAdded: {}, wishSort: 'cut' };
  try {
    const p = Object.assign(defaults, JSON.parse(localStorage.getItem(PREFS_KEY)) || {});
    for (const l of LAUNCHER_ORDER) {
      if (!p.launcherOrder.includes(l)) p.launcherOrder.splice(Math.min(LAUNCHER_ORDER.indexOf(l), p.launcherOrder.length), 0, l);
    }
    return p;
  }
  catch { return defaults; }
}
function savePrefs() { try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch {} }

let lib = { games: [], launchers: {} };
let prefs = loadPrefs();
const state = { view: { name: 'home' }, query: '', lines: new Set(), accounts: new Set(), showHidden: false,
                genre: '', collection: '', showAll: false, copy: {},
                special: '', sort: prefs.libSort || 'name', focus: null, returnTo: 'home', scroll: {}, backFocus: {}, running: {}, opened: {}, achSid: {}, achFilter: 'all', achAll: false,
                shops: new Set(),
                browse: { q: '', genres: new Set(), maxPrice: '', onSale: false, sort: 'rank', limit: 60 } };
let store = null;  // price data, loaded the first time the Store or Wishlist opens

const THEMES = { dark: 'Dark', light: 'Light', system: 'Match Windows' };
// Layouts arrange the pages (each draws its own Home, Library and game page; the Store, Wishlist, Stats, menus
// and dialogs are shared). Styles are the look, and work with every layout: a style is CSS under
// html[data-style="…"]. Only a style with `themes` has light and dark versions; the others are always dark.
const LAYOUTS = {
  console: { name: 'Console', about: 'Big covers, made for a controller', home: () => renderHome(), library: () => renderLibrary(), game: g => renderGame(g) },
  classic: { name: 'Classic', about: 'Your games in a list on the left', home: () => renderClassic(), library: () => renderClassic(), game: () => renderClassic(),
             shown: () => (state.view.name === 'home' ? null : classicGame()) },
  big: { name: 'Big screen', about: 'For a TV: full screen, big covers in one row', home: () => renderBigHome(), library: () => renderLibrary(), game: g => renderGame(g) },
};
const STYLES = {
  junction: { name: 'Junction', about: 'The original look, light or dark', themes: true },
  glass: { name: 'Glass', about: 'Frosted panels over the artwork' },
  mono: { name: 'Monochrome', about: 'Black and white, no colour' },
  sharp: { name: 'Sharp', about: 'Cut corners and a bold accent' },
};
const layout = () => LAYOUTS[prefs.layout] || LAYOUTS.console;
const style = () => (STYLES[prefs.style] ? prefs.style : 'junction');
function applyLook() {
  document.documentElement.dataset.layout = LAYOUTS[prefs.layout] ? prefs.layout : 'console';
  document.documentElement.dataset.style = style();
  applyTheme();
  syncBigScreen();
}
// Big screen fills the screen and zooms the page to it; any other layout is a normal window again.
let bigFull = false;
function syncBigScreen(full) {
  const big = prefs.layout === 'big';
  if (!host.inApp || (full === undefined && big === syncBigScreen.was)) return;
  if (full === undefined && !big && syncBigScreen.was === undefined) { syncBigScreen.was = false; return; }
  syncBigScreen.was = big;
  return host.bigScreen(big, full).then(r => { if (r) bigFull = r.fullScreen; }).catch(() => {});
}
addEventListener('resize', () => {
  clearTimeout(syncBigScreen.t);
  if (prefs.layout === 'big') syncBigScreen.t = setTimeout(() => host.fitBigScreen().catch(() => {}), 250);
});
function applyTheme() {
  const theme = STYLES[style()].themes ? prefs.theme : 'dark';
  if (theme === 'system') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = theme;
  const b = document.getElementById('theme-btn');
  if (b) { b.title = `Theme: ${THEMES[prefs.theme]}`; b.innerHTML = ICON[prefs.theme === 'system' ? 'auto' : prefs.theme === 'light' ? 'sun' : 'moon']; b.hidden = !STYLES[style()].themes; }
}

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lineVar = l => `--c: var(--line-${l})`;
const ICON = {
  person: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1-3.7 3.9-5.6 7.5-5.6s6.5 1.9 7.5 5.6"/></svg>',

const launcherIcon = l => LOGO[l]
  ? `<svg class="li" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="${LOGO[l]}"/></svg>`
  : `<svg class="li" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7.5h6l2 2h9v9h-17z"/></svg>`;
const launcherBadge = t => {
  const ls = [...new Set((t.copies || [t]).map(c => c.launcher))];
  const label = ls.map(l => lib.launchers[l] || LAUNCHER_SHORT[l] || l).join(', ');
  return `<span class="lbadge" role="img" aria-label="${esc(label)}" title="${esc(label)}">${ls.map(l => `<i style="${lineVar(l)}">${launcherIcon(l)}</i>`).join('')}</span>`;
};
const sizeOf = t => Math.max(0, ...t.copies.map(c => c.sizeBytes || 0)) || null;
const friendsOwning = appid => (appid && (lib.friendOwners || {})[appid] || []).map(i => lib.friends[i]).filter(Boolean);
const friendsIn = appid => (lib.friends || []).filter(f => f.playing && String(f.playing.appid) === String(appid));
const dlcSalesOf = t => (t.steamAppId && (lib.dlcSales || {})[t.steamAppId]) || [];
// The developer's latest Steam announcements; patch notes count as an update.
const newsOf = t => (t && t.steamAppId && (lib.news || {})[t.steamAppId]) || [];
const NEWS_DAYS = 21, UPDATED_DAYS = 7;  // the game's own panel; Home's "Recently updated" row
function latestNews(t, days = NEWS_DAYS) {
  const fresh = newsOf(t).filter(x => Date.now() / 1000 - x.date < days * 864e2);
  return fresh.find(x => x.patch) || fresh[0] || null;
}
const newsKind = x => x.patch ? 'Patch notes' : 'News';
function newsHtml(t) {
  return `<section class="news" aria-label="News">${newsOf(t).map(x => `
    <a class="news-item" href="${esc(x.url)}" target="_blank" rel="noopener">
      <span class="when"><i class="${x.patch ? 'patch' : ''}">${newsKind(x)}</i>${esc(when(x.date))}</span>
      <b>${esc(x.title)}</b>
      ${x.text ? `<span class="txt">${esc(x.text)}</span>` : ''}
      <span class="more">Read it on Steam ↗</span>
    </a>`).join('')}</section>
    <p class="note">The developer's own announcements on Steam${host.inApp ? '' : ', as of the last scan'}.</p>`;
}
// "No games match" and friends: a short title, one line, and a way out.
const emptyState = (icon, title, text, actions = '') => `
  <div class="empty-card">${icon ? `<span class="ei">${icon}</span>` : ''}<b>${esc(title)}</b>${text ? `<p>${esc(text)}</p>` : ''}${actions ? `<div class="btns">${actions}</div>` : ''}</div>`;
const avatar = f => f.avatar ? `<img class="face" src="${esc(f.avatar)}" alt="" title="${esc(f.name)}">` : `<span class="face" title="${esc(f.name)}">${esc(initials(f.name))}</span>`;
// "Alex, Sam and 3 more own this" with their pictures.
function friendsLine(appid) {
  const own = friendsOwning(appid), playing = friendsIn(appid);
  if (!own.length && !playing.length) return '';
  const names = list => list.length <= 2 ? list.map(f => f.name).join(' and ') : `${list[0].name}, ${list[1].name} and ${list.length - 2} more`;
  return `<p class="friends-line"><span class="faces">${[...new Set([...playing, ...own])].slice(0, 4).map(avatar).join('')}</span>
    <span>${playing.length ? `<b>${esc(names(playing))} ${playing.length > 1 ? 'are' : 'is'} playing now</b>${own.length ? ' · ' : ''}` : ''}${own.length ? `${esc(names(own))} ${own.length > 1 ? 'own' : 'owns'} this` : ''}</span></p>`;
}
// Store games in the same series as a game you own (a sequel, prequel or spin-off) that are on sale and you don't own.
const seriesKey = name => normTitle(name).replace(/\b(\d+|ii|iii|iv|v|vi|vii|viii|ix|x)\b.*$/, '').split(' ').slice(0, 3).join(' ').trim();
// Store games on sale that you don't own, by series, biggest discount first.
const seriesOnSale = memo(() => [store, titles, [...state.shops].join()], () => {
  const bySeries = new Map();
  for (const sg of Object.values(store.games)) {
    if (ownsOf(sg).length || !(bestDeal(sg)?.cut > 0) || libraryTitleFor(sg)) continue;
    const k = seriesKey(sg.title);
    if (!bySeries.has(k)) bySeries.set(k, []);
    bySeries.get(k).push(sg);
  }
  for (const list of bySeries.values()) list.sort((a, b) => bestDeal(b).cut - bestDeal(a).cut);
  return bySeries;
});
function seriesSales(t) {
  if (!store) return [];
  const k = seriesKey(t.name);
  if (k.length < 4) return [];
  const base = editionBase(t.name);
  return (seriesOnSale().get(k) || []).filter(sg => editionBase(sg.title) !== base);
}
// Small "DLC -60%" / "Series -75%" badges on Library covers, added once the data is there.
function paintSaleBadges() {
  if (state.view.name !== 'library') return;
  for (const el of document.querySelectorAll('#main .lgrid .tile[data-focus], #main .lrow[data-focus]')) {
    if (el.querySelector('.sale')) continue;
    const t = findGame(el.dataset.focus);
    if (!t) continue;
    const dlc = dlcSalesOf(t), series = seriesSales(t);
    const label = dlc.length ? `DLC -${dlc[0].cut}%` : series.length ? `Series -${bestDeal(series[0]).cut}%` : '';
    if (!label) continue;
    const tip = dlc.length ? `${dlc.length} DLC on sale on Steam` : `${series[0].title} is on sale`;
    (el.querySelector('.art') || el.querySelector('.n')).insertAdjacentHTML('beforeend', `<span class="sale" title="${esc(tip)}">${esc(label)}</span>`);
  }
}

// ---------- tiles: the covers on Home and in the Library ----------
const firstLetter = name => { const c = name.trim()[0]?.toUpperCase() || '#'; return c >= 'A' && c <= 'Z' ? c : '#'; };
function tile(g, big, opts = {}) {
  const on = isInstalled(g);
  return `
    <button class="tile${on ? '' : ' off'}${big ? ' big' : ''}" style="${lineVar(g.launcher)}" data-open="${esc(g.id)}" data-focus="${esc(g.id)}"${opts.tab ? ` data-tab="${opts.tab}"` : ''}
            aria-label="${esc(g.name)}${on ? '' : ', not installed'}${opts.chip ? `, ${esc(opts.chip.join(', '))}` : ''}">
      <span class="art">${coverArt(g)}${isFav(g) ? `<span class="fav-dot">${ICON.star}</span>` : ''}${launcherBadge(g)}${opts.chip ? `<span class="upd"><b>${esc(opts.chip[0])}</b>${esc(opts.chip[1])}</span>` : ''}
        <span class="play-hint" data-quick="${esc(g.id)}" title="${on ? 'Play' : 'Install'}">${on ? ICON.play : ICON.download}</span></span>
      <span class="cap">${esc(g.name)}</span>
    </button>`;
}
const seeAll = (count, preset) => `
  <button class="tile all" data-see="${esc(preset)}" aria-label="See all ${count}"><span class="art"><b>${count}</b>See all</span></button>`;
function listRow(g) {
  const on = isInstalled(g);
  return `
    <button class="lrow${on ? '' : ' off'}" style="${lineVar(g.launcher)}" data-open="${esc(g.id)}" data-focus="${esc(g.id)}">
      <i class="stripe"></i>
      <span class="thumb">${coverArt(g)}</span>
      <span class="n">${isFav(g) ? `<span class="fav-inline">${ICON.star}</span>` : ''}${esc(g.name)}</span>
      <span class="l">${esc(launcherNames(g))}</span>
      <span class="num">${esc(hours(g.playtimeMinutes) || '–')}</span>
      <span class="num">${esc(on ? (when(g.lastPlayed) || 'Installed') : 'Not installed')}</span>
      <span class="lplay${on ? '' : ' install'}" data-quick="${esc(g.id)}" title="${on ? 'Play' : 'Install'}">${on ? ICON.play : ICON.download}</span>
    </button>`;
}

// "See all" on a Home row opens the Library with the same games.
const SPECIAL = {
  recent: ['Installed', isInstalled, 'recent'],
  installed: ['Installed', isInstalled, 'name'],
  favs: ['Favourites', t => isFav(t), 'name'],
  played: ['Most played', t => !!t.playtimeMinutes, 'played'],
};

// ---------- Home: the focused game's art behind a few rows ----------
const ROW_MAX = 14;
function homeRows() {
  const all = titles.filter(t => !isHidden(t));
  const rows = [];
  const add = (title, games, preset, extra = {}) => { if (games.length) rows.push({ title, games, preset, count: games.length, ...extra }); };
  add('Continue playing', sorted(all.filter(SPECIAL.recent[1]), 'recent'), 'recent', { big: true });
  const updated = all.filter(t => isInstalled(t) && latestNews(t, UPDATED_DAYS)).sort((a, b) => latestNews(b, UPDATED_DAYS).date - latestNews(a, UPDATED_DAYS).date);
  add('Recently updated', updated, '', { news: true, note: 'This week’s patch notes and news from the developers' });
  add('Favourites', sorted(all.filter(isFav), 'recent'), 'favs');
  for (const c of prefs.collections) add(c.name, sorted(all.filter(t => inCollection(t, c)), 'name'), `col:${c.name}`, { note: 'Collection' });
  add('Most played', sorted(all.filter(t => t.playtimeMinutes), 'played'), 'played');

}
function renderHome() {

// ---------- Home and Store open on their first row; scrolling down brings in the rest ----------

  // Measure the first row as it looks in the opening view, with its big covers.
  const was = h.classList.contains('intro');

  let first = 0;

  // Downloads in progress sit between the panel and the first row: they take their room from the panel.

  h.style.setProperty('--intro-h', `${Math.max(300, $('#main').clientHeight - first - 46 + 26 - 6 - downloadsH)}px`);
  // How tall the panel is with everything in it: a full-size logo, achievements and a news line.

function setBackdrop(src, soft) {
  const bd = $('#backdrop');
  if (!bd || bd.dataset.src === src) return;
  bd.dataset.src = src;
  const old = [...bd.querySelectorAll('img')];
  if (!src) return old.forEach(o => o.remove());
  const img = new Image();
  img.alt = '';
  if (soft) img.className = 'soft';
  img.onload = () => {
    if (bd.dataset.src !== src) return;
    bd.prepend(img);
    requestAnimationFrame(() => { img.classList.add('in'); old.forEach(o => o.classList.remove('in')); });
    setTimeout(() => old.forEach(o => o.remove()), 600);
  };

// ---------- logos on the page's own background: is this one mostly dark, or mostly white? ----------
// Measured once per picture, from a copy loaded for reading (Steam's art allows that); a picture that can't be read
// is left as it is.
const logoTones = new Map();
function toneLogo(img) {
  const src = img.currentSrc || img.src;
  if (!/^https?:/.test(src)) return;
  const set = t => { if (t) img.dataset.tone = t; else delete img.dataset.tone; };
  const had = logoTones.get(src);
  if (typeof had === 'string') return set(had);
  if (had) return had.then(set);
  const job = new Promise(done => {
    const im = new Image();
    im.crossOrigin = 'anonymous';
    im.onerror = () => done('');
    im.onload = () => {
      try {
        const c = document.createElement('canvas');
        c.width = 64; c.height = Math.max(1, Math.round(64 * im.height / im.width));
        const x = c.getContext('2d');
        x.drawImage(im, 0, 0, c.width, c.height);
        const d = x.getImageData(0, 0, c.width, c.height).data;
        let dark = 0, light = 0, all = 0;
        for (let i = 0; i < d.length; i += 4) {
          const a = d[i + 3] / 255;
          if (a < .5) continue;
          const l = (.2126 * d[i] + .7152 * d[i + 1] + .0722 * d[i + 2]) / 255;
          all += a; if (l < .3) dark += a; else if (l > .8) light += a;
        }
        done(!all ? '' : dark / all > .45 ? 'dark' : light / all > .6 ? 'light' : '');
      } catch { done(''); }
    };
    im.src = src;
  });
  logoTones.set(src, job);
  job.then(t => { logoTones.set(src, t); set(t); });
}
document.addEventListener('load', e => { if (e.target.matches?.('img.logo')) toneLogo(e.target); }, true);

function jumpTo(letter) {
  const el = document.getElementById(`letter-${letter}`);
  if (!el) return;
  el.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  // Covers passed on the way take their real size as they come on screen, which can move the letter a little.
  const main = $('#main');
  const snap = () => { main.removeEventListener('scrollend', snap); if (el.isConnected) el.scrollIntoView({ block: 'start' }); };
  main.addEventListener('scrollend', snap);
  setTimeout(() => main.removeEventListener('scrollend', snap), 2000);  // a jump that didn't need to scroll
  el.nextElementSibling?.focus({ preventScroll: true });
}

// ---------- sideways rows: arrow buttons for the mouse (keys and controllers already move along them) ----------
const stripSizes = new ResizeObserver(entries => entries.forEach(e => updateArrows(e.target)));
// A Home row's "See all" is only there when some of its games are out of sight: more than the row holds, or more
// than fit next to each other on the screen.
function fitSeeAll(strip) {
  const all = strip.querySelector(':scope > .tile.all[data-see]');
  if (!all || !strip.closest('.games-home')) return;
  const games = strip.querySelectorAll(':scope > .tile:not(.all)');
  const last = games[games.length - 1];
  // Layout positions, not on-screen ones: tiles that are still sliding in would measure wrong.
  const end = last ? last.offsetLeft + last.offsetWidth - (last.offsetParent === strip ? 0 : strip.offsetLeft + strip.clientLeft) : 0;
  all.classList.toggle('unneeded', Number(strip.dataset.count) <= games.length && end <= strip.clientWidth + 1);
}
function updateArrows(strip) {

  if (!strip.isConnected) return stripSizes.unobserve(strip);  // the page it was on is gone
  fitSeeAll(strip);
  if (!prev) return;
  prev.hidden = strip.scrollLeft <= 4;
  next.hidden = strip.scrollLeft >= strip.scrollWidth - strip.clientWidth - 4;
  prev.style.top = next.style.top = `${strip.offsetTop + strip.offsetHeight / 2}px`;
}
function addArrows() {
  for (const strip of document.querySelectorAll('#main .tiles, #main .rail, #main .big-rail')) {
    if (strip.arrows) { updateArrows(strip); continue; }
    const box = strip.parentElement;
    box.classList.add('has-arrows');
    strip.arrows = [-1, 1].map(dir => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = `strip-arrow ${dir < 0 ? 'prev' : 'next'}`;
      b.tabIndex = -1;
      b.setAttribute('aria-hidden', 'true');
      b.hidden = true;
      b.innerHTML = `<svg viewBox="0 0 24 24"><path d="${dir < 0 ? 'M15 5l-7 7 7 7' : 'M9 5l7 7-7 7'}" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      b.onclick = e => { e.stopPropagation(); strip.scrollBy({ left: dir * strip.clientWidth * .8, behavior: 'smooth' }); };
      box.append(b);
      return b;
    });
    strip.addEventListener('scroll', () => updateArrows(strip), { passive: true });
    stripSizes.observe(strip);
    updateArrows(strip);
  }
}
// Rows are drawn (and filled in) at many moments; check for new ones once per frame after any change.
new MutationObserver(() => {
  if (addArrows.queued) return;
  addArrows.queued = true;
  requestAnimationFrame(() => { addArrows.queued = false; addArrows(); });
}).observe($('#main'), { childList: true, subtree: true });

// ---------- arrow keys and controllers move between games ----------
// The top bar: the tabs, then your picture, friends, search, theme and refresh.
const barItems = () => [...document.querySelectorAll('.topbar .nav button, .topbar .top-right button')]
  .filter(el => el.offsetParent !== null && !el.disabled);

// The Browse filter's "Under …" steps: 5, 10, 20 and 40 in euros or dollars, steps of about the same worth in
// other currencies, rounded to tidy amounts. A currency not listed goes by what games cost in it.
const PRICE_SCALE = { PLN: 4, BRL: 5, CNY: 5, TWD: 25, TRY: 40, INR: 50, PHP: 50, JPY: 200, ARS: 1000, KRW: 1000, IDR: 10000 };
function priceSteps() {
  if (['EUR', 'USD', 'GBP', 'CAD', 'AUD', 'NZD', 'CHF'].includes(store.currency)) return [5, 10, 20, 40];
  let scale = PRICE_SCALE[store.currency];
  if (!scale) {
    const regular = catalogGames().map(sg => sg.deals[0]?.regular).filter(v => v > 0).sort((a, b) => a - b);
    scale = regular.length ? regular[regular.length >> 1] / 20 : 1;  // a typical Store game costs about 20 euros
  }
  const tidy = v => {
    const p = 10 ** Math.floor(Math.log10(v));
    return [1, 2, 2.5, 5, 10].map(m => m * p).reduce((a, b) => (Math.abs(Math.log(b / v)) < Math.abs(Math.log(a / v)) ? b : a));

}

// The cheapest first-party price over the last year, as a step line.
function historyChart(sg) {
  let h = sg.history;
  const today = bestDeal(sg)?.price;
  // The line runs on to today, at today's price (the history only lists the days a price changed).
  if (h && h.length) { const last = h[h.length - 1]; h = [...h, [Math.max(Date.now() / 1000, last[0]), today ?? last[1]]]; }
  if (!h || h.length < 2 || (sg.history.length < 2 && h[0][1] === h[1][1])) {
    return `<p class="note">${host.inApp ? 'No price changes in the last year.'
      : 'Price history loads in the app.'}</p>`;
  }
  const t0 = h[0][0], t1 = h[h.length - 1][0], now = h[h.length - 1][1];
  const prices = h.map(p => p[1]), max = Math.max(...prices), min = Math.min(...prices);
  const W = 600, H = 120, pad = 8;
  const x = ts => ((ts - t0) / ((t1 - t0) || 1) * W).toFixed(1);
  const y = p => (pad + (max === min ? .5 : (max - p) / (max - min)) * (H - pad * 2)).toFixed(1);
  let d = `M0 ${y(h[0][1])}`;
  for (const [ts, p] of h.slice(1)) d += ` H${x(ts)} V${y(p)}`;
  const low = h.reduce((m, p) => p[1] < m[1] ? p : m);
  return `
    <div class="history">
      <div class="y"><span>${money(max)}</span><span>${money(min)}</span></div>
      <div class="plot" tabindex="0" data-h="${esc(JSON.stringify(h))}" data-max="${max}" data-min="${min}">
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Best price since ${histDate(t0)}: between ${money(min)} and ${money(max)}">
          <path class="area" d="${d} V${H} H0 Z"/><path class="now" d="M0 ${y(now)} H${W}"/><path class="ln" d="${d}"/>
        </svg>
      </div>
      <div class="x"><span>${histDate(t0)}</span><span>Today · ${money(now)}</span></div>
    </div>
    <p class="note">Lowest: ${min === 0 && max > 0 ? 'free (a giveaway)' : money(min)} on ${histDate(low[0])} · Point at the line, or select it and press left and right, to see the price on any day.</p>`;
}
const histDate = ts => new Date(ts * 1000).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
// Pointing at the price chart: a line, a dot and the price on that day, compared with today's.
// f is how far along the chart (0 to 1).
function histHover(plot, f) {
  const h = JSON.parse(plot.dataset.h), max = +plot.dataset.max, min = +plot.dataset.min;
  const r = plot.getBoundingClientRect();
