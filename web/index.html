  let i = 0;
  while (i + 1 < h.length && h[i + 1][0] <= t) i++;
  const p = h[i][1], now = h[h.length - 1][1], diff = p - now;
  const yf = (8 + (max === min ? .5 : (max - p) / (max - min)) * 104) / 120;
  if (!plot.querySelector('.hist-tip')) plot.insertAdjacentHTML('beforeend', '<i class="hist-guide"></i><i class="hist-dot"></i><div class="hist-tip" aria-hidden="true"></div>');
  const [guide, dot, tip] = plot.querySelectorAll('.hist-guide, .hist-dot, .hist-tip');
  plot.classList.add('hover');
  guide.style.left = dot.style.left = `${f * 100}%`;
  dot.style.top = `${yf * 100}%`;
  const cmp = Math.abs(diff) < 0.005 ? 'Same as today'
    : diff < 0 ? `${money(-diff)} cheaper than today` : `${money(diff)} more than today`;
  tip.innerHTML = `<b>${p === 0 ? 'Free' : money(p)}</b><span>${f > .995 ? 'Today' : histDate(t)}</span>${f > .995 ? '' : `<span class="${diff < -0.005 ? 'less' : ''}">${cmp}</span>`}`;
  tip.classList.toggle('below', yf < .5);  // keep it off the dot

document.addEventListener('pointermove', e => {
  const plot = e.target.closest?.('.history .plot');
  if (plot) { const r = plot.getBoundingClientRect(); return histHover(plot, (e.clientX - r.left) / r.width); }
  if (!document.activeElement?.matches('.history .plot')) $('.history .plot.hover')?.classList.remove('hover');

// With a controller or the arrow keys: the chart is selectable, and left/right step from price change to price change.
function stepHistory(plot, dir) {
  const h = JSON.parse(plot.dataset.h), last = h.length - 1;
  let i = plot.dataset.i == null ? last : +plot.dataset.i;
  if (dir) {
    let j = i + dir;
    while (j > 0 && j < last && h[j][1] === h[i][1]) j += dir;  // same price again: not a change
    i = Math.max(0, Math.min(last, j));
  }
  plot.dataset.i = i;
  histHover(plot, i === last ? 1 : (h[i][0] - h[0][0]) / ((h[last][0] - h[0][0]) || 1) + 1e-9);

document.addEventListener('focusin', e => { if (e.target.matches?.('.history .plot')) { delete e.target.dataset.i; stepHistory(e.target, 0); } });
document.addEventListener('focusout', e => { if (e.target.matches?.('.history .plot')) e.target.classList.remove('hover'); });
document.addEventListener('keydown', e => {
  if (!['ArrowLeft', 'ArrowRight'].includes(e.key) || e.altKey || !e.target.matches?.('.history .plot')) return;  // Alt: back and forward
  e.preventDefault(); e.stopImmediatePropagation();
  stepHistory(e.target, e.key === 'ArrowLeft' ? -1 : 1);
}, true);

function sparkline(h) {

  const y = p => (2 + (max === min ? .5 : (max - p) / (max - min)) * (H - 4)).toFixed(1);

const colourCache = new Map();

// Saving, removing and the "get a key" links, for every key form inside `dlg`.
function wireKeys(dlg) {
  dlg.addEventListener('click', e => {
    const a = e.target.closest('a[data-url]');
    if (a) { e.preventDefault(); host.openUrl(a.dataset.url); return; }
    const acct = e.target.closest('[data-acct-remove]');
    if (acct) return removeAccount(acct);
    const back = e.target.closest('[data-acct-restore]');
    if (back) return restoreAccount(back);
    const rm = e.target.closest('[data-key-remove]');
    if (!rm) return;
    // Removing asks once more, on the same button.
    if (!rm.dataset.sure) { rm.dataset.sure = '1'; rm.textContent = 'Remove it?'; return; }
    saveKey(rm.closest('form'), '');
  });
  // Enter (or a controller's A) in the field saves.
  dlg.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.matches('.key-row input')) { e.preventDefault(); e.target.form.requestSubmit(); }
  });
  dlg.addEventListener('submit', e => {
    e.preventDefault();
    const input = e.target.querySelector('input');
    if (!input.value.trim()) return input.focus();
    saveKey(e.target, input.value.trim());
  });
}
// Removing a Steam account asks first, on the same button, and says what it does.
// A launcher sign-in in the profile menu: sign in on the store's own page; signed in, press twice to sign out.
function signInRow(info, store, label) {
  const s = info.signins?.[store];
  const now = () => (!s ? 'Sign in' : s.expired ? 'Sign in again' : s.name);
  return { icon: launcherIcon(store), label, value: now(), run: async b => {
    const v = b.querySelector('.pm-val'), menu = b.closest('#ctx');
    if (signInRow.busy) return;  // its window is open: pressing again changes nothing
    // Signed in: press twice to sign out. Run out: press to sign in again, or twice quickly to just forget it.
    if (s && (!s.expired || b.dataset.sure)) {
      if (!b.dataset.sure) { b.dataset.sure = '1'; v.textContent = 'Sign out?'; return; }
      await host.signOut(store).catch(() => null);
      if (lib.signins) { delete lib.signins[store]; checkSignIns(); }
      if ($('#ctx') === menu) closeMenu();
      return toast(`Signed out of ${label}. Its play time leaves your library in a moment.`, store);
    }
    if (s?.expired) b.dataset.sure = '1';
    v.textContent = 'Signing in…';
    signInRow.busy = true;
    const res = await host.signIn(store).catch(() => null);
    signInRow.busy = false;
    if (!res?.ok) { v.textContent = s?.expired ? 'Sign out?' : now(); return toast(res?.error || 'Junction couldn’t sign in. Try again.'); }
    if (lib.signins) { lib.signins = { ...lib.signins, [store]: { name: res.name, expired: false } }; checkSignIns(); }
    if ($('#ctx') === menu) closeMenu();
    toast(`Signed in as ${res.name}. ${label} play time shows up in a moment.`, store);
  } };
}
async function removeAccount(btn) {
  const form = btn.closest('form'), msg = form.querySelector('.key-msg'), name = form.dataset.name;
  if (!btn.dataset.sure) {
    btn.dataset.sure = '1';
    btn.classList.add('sure');
    btn.innerHTML = 'Remove account?';
    msg.className = 'key-msg bad';
    msg.textContent = `Removes ${name} from Junction: ${form.querySelector('[data-key-remove]') ? 'its key is deleted and ' : ''}its games that aren’t installed leave your library. Steam itself isn’t changed, and you can add it back below.`;
    return;
  }
  btn.disabled = true;
  const res = await host.removeAccount(form.dataset.sid).catch(() => null);
  if (!res?.ok) { btn.disabled = false; msg.textContent = res?.error || 'Junction couldn’t remove the account. Try again.'; return; }
  const box = form.closest('.dialog').querySelector('.key-removed');
  box.hidden = false;
  box.insertAdjacentHTML('beforeend', removedRow({ steamId: form.dataset.sid, name }));
  const next = form.nextElementSibling?.matches('.key-row') ? form.nextElementSibling : form.previousElementSibling;
  form.remove();
  (next?.querySelector('input') || box.querySelector('button:last-child'))?.focus();
  toast(`${name} is removed. Your library updates in a moment.`);
}
async function restoreAccount(btn) {
  const row = btn.closest('.key-removed-row');
  btn.disabled = true;
  const res = await host.restoreAccount(row.dataset.sid).catch(() => null);
  if (!res?.ok) { btn.disabled = false; return toast(res?.error || 'Junction couldn’t add the account back.'); }
  toast(`${res.name || 'The account'} is back. Your library updates in a moment.`);
  // Draw the list again, so the account gets its own row (and key field) back.
  const dlg = btn.closest('.dialog'), wizard = dlg.classList.contains('setup');
  if (wizard) return setupWizard.redraw?.();
  keysDialog('steam');
}
async function saveKey(form, key) {
  const kind = form.dataset.kind, msg = form.querySelector('.key-msg'), input = form.querySelector('input');
  const controls = [...form.querySelectorAll('button, input')];
  msg.className = 'key-msg';
  msg.textContent = key ? `Checking the key with ${KEY_WHO[kind]}…` : 'Removing the key…';
  controls.forEach(b => (b.disabled = true));
  let res;
  try { res = await host.setKey(kind, form.dataset.sid || null, key); } catch { res = null; }
  controls.forEach(b => (b.disabled = false));
  if (!res?.ok) {
    msg.className = 'key-msg bad';
    msg.textContent = res?.error || 'Junction couldn’t save the key. Try again.';
    return input.focus();
  }
  const state = form.querySelector('.key-state');
  input.value = '';
  input.placeholder = key ? 'Paste a new key to replace it' : 'Paste the key here';
  state.textContent = keyState(key && `…${key.slice(-4)}`);
  state.classList.toggle('on', !!key);
  form.querySelector('[data-key-remove]')?.remove();
  if (key) form.querySelector('.key-field').insertAdjacentHTML('beforeend', '<button class="btn" type="button" data-key-remove>Remove key</button>');
  const name = res.name || form.dataset.name;
  msg.textContent = !key ? 'Removed.'
    : kind === 'steam' ? `Saved. Junction is reading ${name ? `${name}’s` : 'this account’s'} games now; the library updates in a minute or so.`
    : kind === 'prices' ? 'Saved. The Store is fetching prices with it now; that takes about a minute.'
    : 'Saved. Missing covers come in with the scan that has just started.';
  input.focus();
}

// ---------- where prices are for: a country, chosen in the setup or under Preferences > Prices ----------
const countryPickerHtml = () => `
      <label class="lsearch country-search">${ICON.search}<input id="country-q" type="search" placeholder="Type a country" autocomplete="off" aria-label="Search for a country"></label>
      <div class="country-list" id="country-list" role="listbox" aria-label="Countries"></div>`;
// The list under the search box. Without a search, the chosen country and Windows' region come first. Typing finds
// a country by its English name, its name in Windows' language, or its two-letter code; names that start with it first.
function wireCountryPicker(box, current, region, onPick) {
  const local = (() => { try { return new Intl.DisplayNames([moneyStyle.locale], { type: 'region' }); } catch { return null; } })();
  const fold = v => String(v || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const all = COUNTRIES.map(c => ({ c, name: countryName(c), find: fold(`${countryName(c)} ${local?.of(c) || ''}`) }))
    .sort((a, b) => a.name.localeCompare(b.name));
  const input = box.querySelector('#country-q'), list = box.querySelector('#country-list');
  const draw = () => {
    const q = fold(input.value.trim()), now = current();
    let shown;
    if (q) {
      const hits = all.filter(x => x.find.includes(q) || x.c.toLowerCase() === q);
      const early = x => x.c.toLowerCase() === q || x.find.split(/[\s,()-]+/).some(w => w.startsWith(q));
      shown = [...hits.filter(early), ...hits.filter(x => !early(x))];
    } else {
      const top = [...new Set([now, region].filter(Boolean))].map(c => all.find(x => x.c === c)).filter(Boolean);
      shown = [...top, ...all.filter(x => !top.includes(x))];
    }
    list.innerHTML = shown.map(x => `<button type="button" class="country" role="option" data-pick-country="${x.c}" aria-selected="${x.c === now}">
        <span>${esc(x.name)}</span>${x.c === region ? '<i>Windows’ region</i>' : ''}${x.c === now ? PM.check : ''}</button>`).join('')
      || `<p class="note">No country is called “${esc(input.value.trim())}”.</p>`;
  };
  input.addEventListener('input', draw);
  input.addEventListener('keydown', e => {
    const first = list.querySelector('[data-pick-country]');
    if (e.key === 'ArrowDown' && first) { e.preventDefault(); first.focus(); }
    if (e.key === 'Enter' && first) { e.preventDefault(); first.click(); }
  });
  list.addEventListener('keydown', e => {
    const btns = [...list.querySelectorAll('[data-pick-country]')], i = btns.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' && i < btns.length - 1) { e.preventDefault(); btns[i + 1].focus(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); (i > 0 ? btns[i - 1] : input).focus(); }
  });
  list.addEventListener('click', e => {
    const b = e.target.closest('[data-pick-country]');
    if (!b) return;
    onPick(b.dataset.pickCountry);
    if (box.isConnected) {  // still open (the setup): show the new choice
      draw();
      list.querySelector(`[data-pick-country="${b.dataset.pickCountry}"]`)?.focus();
    }
  });
  draw();
}

let storePromise = null;
function loadStoreQuiet() {
  if (store) return Promise.resolve(store);

    .catch(() => { storePromise = null; return null; });

const liveGames = new Map();
// Wishlist games that have left the Store's list: ask for today's prices, so they still show what they cost.
async function pricesForGone() {
  if (!host.inApp || !store) return;
  const gone = Object.values(store.games).filter(sg => sg.gone && !sg.priced);
  if (!gone.length) return;
  gone.forEach(sg => { sg.priced = true; });
  const got = await host.prices(gone.map(sg => sg.id)).catch(() => null);
  if (!got) { gone.forEach(sg => { sg.priced = false; }); return; }
  let changed = false;
  for (const sg of gone) {
    const p = got[sg.id];
    if (p && p.deals.length) { sg.deals = p.deals; sg.historyLow = p.historyLow; changed = true; }
  }

}

// Numbers count up from 0 when a page with [data-to] opens.
function countUp() {
  const els = [...document.querySelectorAll('#main [data-to]')];
  const show = (el, v) => { el.textContent = Math.round(v).toLocaleString('en-GB') + el.dataset.suffix; };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return els.forEach(el => show(el, +el.dataset.to));
  const t0 = performance.now(), dur = 900;
  const step = now => {
    const p = Math.min(1, Math.max(0, (now - t0) / dur)), e = 1 - (1 - p) ** 3;
    for (const el of els) if (el.isConnected) show(el, +el.dataset.to * e);
    if (p < 1 && els.some(el => el.isConnected)) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

  if (view.name === 'store' || view.name === 'browse' || (view.name === 'price' && view.from !== 'wishlist')) return 'store';
  if (view.name === 'wishlist' || view.name === 'price') return 'wishlist';

function vkbNames(q) {

    try {
      if (info?.money?.locale) {
        moneyStyle = { ...info.money, locale: new Intl.NumberFormat(info.money.locale).resolvedOptions().locale };
        moneyFormats = {};
      }
    } catch { /* a locale the page doesn't know: keep the default */ }
    // Junction used to show Dutch prices to everyone: once, it says which country the prices are for now.
    if (info?.setupDone && !info.countryChosen) { countryNote = info.country; host.setCountry(info.country); }
    if (!info || info.setupDone) return;
    if (info.prices || info.accounts.some(a => a.key)) return host.setOption('setupDone', true);
    setTimeout(setupWizard, 1200);  // after the opening animation
  })
    // Just updated: what's new, once the opening animation is over. (After the above: both save settings.)
    .then(() => host.whatsNew())
    .then(info => info && setTimeout(() => whatsNewDialog(info), 1500))
    .catch(() => {});
  // Prices load even when Junction starts in the tray, so wishlist deals are checked.
  if (host.inApp) setTimeout(loadStoreQuiet, 20000);
  const tick = () => { $('#clock').textContent = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); };
  tick();
  setInterval(tick, 20000);
})();
</script>
